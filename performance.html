<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venejugos · Performance vendedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0B2A8A;        /* azul Venejugos profundo */
  --azul-med:#1740C4;
  --azul-claro:#E8EDFB;
  --rojo:#E5142B;
  --rojo-oscuro:#B00C1F;
  --blanco:#FFFFFF;
  --papel:#F4F6FC;
  --tinta:#10193A;
  --gris:#66708F;
  --linea:#D8DFF2;
  --verde:#128C5A;
  --ambar:#E08A00;
  --sombra:0 1px 2px rgba(11,42,138,.10), 0 8px 24px rgba(11,42,138,.07);
  --radio:14px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--papel); color:var(--tinta);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- Encabezado ---------- */
.barra{
  background:linear-gradient(105deg,var(--azul) 0%,var(--azul-med) 58%,#2C56E0 100%);
  color:#fff; position:relative; overflow:hidden;
}
.barra::after{
  content:""; position:absolute; right:-70px; top:-60px; width:260px; height:260px;
  background:var(--rojo); border-radius:50%; opacity:.9;
  clip-path:polygon(0 40%,100% 0,100% 100%,0 100%);
}
.barra-in{display:flex; gap:18px; align-items:center; padding:18px 26px; position:relative; z-index:2; flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;padding:5px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tit h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tit p{margin:3px 0 0;font-size:.82rem;color:#C9D6FF;font-weight:500}
.sello{
  margin-left:auto;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 15px;font-size:.76rem;font-weight:700
}
.sello b{color:#fff}

/* ---------- Cinta de filtros ---------- */
.filtros{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--linea);padding:12px 26px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:150px}
.campo label{font-size:.68rem;font-weight:700;color:var(--gris);letter-spacing:.03em}
select,input[type=number],input[type=text],input[type=password],input[type=file]{
  font-family:inherit;font-size:.86rem;padding:8px 10px;border:1.5px solid var(--linea);
  border-radius:9px;background:#fff;color:var(--tinta);min-width:140px
}
select:focus,input:focus{outline:2px solid var(--azul-med);outline-offset:1px;border-color:var(--azul-med)}
.btn{
  font-family:inherit;font-size:.84rem;font-weight:700;padding:9px 18px;border-radius:9px;border:0;
  background:var(--rojo);color:#fff;cursor:pointer;transition:background .15s
}
.btn:hover{background:var(--rojo-oscuro)}
.btn.azul{background:var(--azul)} .btn.azul:hover{background:var(--azul-med)}
.btn.linea{background:#fff;color:var(--azul);border:1.5px solid var(--linea)}
.btn.linea:hover{background:var(--azul-claro)}
.btn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

/* ---------- Rejilla ---------- */
main{padding:20px 26px 48px;max-width:1500px;margin:0 auto}
.rej{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1080px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:620px){.c3{grid-column:span 12}}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px}
.tarjeta h3{margin:0 0 2px;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.tarjeta .sub{margin:0 0 12px;font-size:.74rem;color:var(--gris)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--azul)}
.kpi.rojo::before{background:var(--rojo)}
.kpi.verde::before{background:var(--verde)}
.kpi.ambar::before{background:var(--ambar)}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--gris);margin:0 0 6px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.kpi .val small{font-size:.9rem;font-weight:700;color:var(--gris);margin-left:4px}
.kpi .pie{margin:8px 0 0;font-size:.74rem;color:var(--gris);line-height:1.45}
.kpi .pie b{color:var(--tinta)}

.barrita{height:7px;background:var(--azul-claro);border-radius:99px;overflow:hidden;margin-top:10px}
.barrita span{display:block;height:100%;border-radius:99px;background:var(--azul-med)}
.barrita span.ok{background:var(--verde)} .barrita span.mal{background:var(--rojo)} .barrita span.med{background:var(--ambar)}

/* Tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{
  text-align:right;font-weight:700;color:#fff;background:var(--azul);
  padding:9px 10px;white-space:nowrap;position:sticky;top:0
}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFBFF}
tbody tr:hover{background:var(--azul-claro)}
tfoot td{font-weight:800;background:var(--azul-claro);border-top:2px solid var(--azul)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:800}
.pill.ok{background:#DCF3E9;color:var(--verde)}
.pill.med{background:#FDF0D8;color:var(--ambar)}
.pill.mal{background:#FBE0E3;color:var(--rojo-oscuro)}

.grafico{position:relative;height:300px}
.grafico.alto{height:380px}
.grafico.bajo{height:210px}

/* Resumen */
.resumen{background:linear-gradient(160deg,#fff 0%,#F7F9FF 100%);border-left:5px solid var(--rojo)}
.resumen p{font-size:.88rem;line-height:1.62;margin:0 0 12px;max-width:78ch;color:#1D2748}
.resumen p:last-child{margin-bottom:0}
.notas{font-size:.72rem;color:var(--gris);line-height:1.55}

dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:92%;box-shadow:0 30px 80px rgba(11,42,138,.35)}
dialog::backdrop{background:rgba(11,25,58,.55)}
dialog .cab{background:var(--azul);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
dialog .cab h3{margin:0;font-size:1rem}
dialog .cue{padding:20px 22px;max-height:65vh;overflow:auto}

.pie-doc{margin-top:26px;padding-top:14px;border-top:2px solid var(--linea);font-size:.72rem;color:var(--gris);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Impresión */
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  .filtros,.no-print{display:none!important}
  .barra{position:static}
  main{padding:0;max-width:none}
  .tarjeta{box-shadow:none;border:1px solid #C8D2EC;break-inside:avoid;page-break-inside:avoid}
  .rej{gap:9px}
  .grafico{height:230px}
  .salto{break-before:page;page-break-before:always}
}

.sup-cab{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.dona{flex:0 0 auto}
.dona text{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.sup-cab .nom{font-size:1.02rem;font-weight:800;margin:0;line-height:1.2}
.sup-cab .cifra{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.sup-cab .cifra small{font-size:.72rem;font-weight:700;color:var(--gris);display:block;letter-spacing:0}
.equipo{list-style:none;margin:0;padding:0}
.equipo li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:.84rem}
.equipo li+li{margin-top:4px}
.equipo li.bajo{background:#FDF1F3;border:1px solid #F6C9D0}
.equipo .punto{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.equipo .quien{flex:1;font-weight:700}
.equipo .par{font-family:Arial,Helvetica,sans-serif;color:var(--gris);white-space:nowrap}
.equipo .par b{color:var(--tinta)}
.equipo .tanto{font-weight:800;min-width:52px;text-align:right}
.t-ok{color:var(--verde)} .t-med{color:var(--ambar)} .t-mal{color:var(--rojo)}
.cintas{display:flex;height:9px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--azul-claro)}
.cintas span{display:block}
.aviso{border-left:5px solid var(--rojo);background:linear-gradient(160deg,#FFF5F6 0%,#fff 70%)}
.aviso h3{color:var(--rojo-oscuro)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:800;margin:3px 4px 0 0}
.chip.mal{background:#FBE0E3;color:var(--rojo-oscuro)}
.chip.med{background:#FDF0D8;color:var(--ambar)}
td.sem{min-width:84px}
td.sem small{display:block;font-size:.68rem;color:var(--gris);font-weight:600}
td.fuera{color:var(--gris)}
.pestanas{display:flex;gap:8px;border-bottom:2px solid var(--linea);padding-bottom:0}
.pest{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;border:0;background:transparent;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.pest:hover{color:var(--azul)}
.pest.activa{color:var(--azul);border-bottom-color:var(--rojo)}
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.buscador input{min-width:260px}
tr.grupo td{background:var(--azul-claro);font-weight:800;border-top:2px solid var(--azul)}
tr.granTotal td{background:var(--azul);color:#fff;font-weight:800}
tr.granTotal .pill{background:rgba(255,255,255,.18);color:#fff}
</style>
</head>

<script>/* ============================================================
   VENEJUGOS · Motor de cálculo KPI Nestlé
   Aliado comercial evaluador de cumplimiento
   ============================================================ */
const VJ = (function () {
  const TARGETS = {
    "CALDOS": 75, "SOPAS": 75, "LECHE CONDENSADA": 20, "CHOCOLATES": 85,
    "GALLETAS": 70, "CERELAC": 40, "NESTEA": 25, "NESTUM": 30,
    "LA CAMPESINA": 20, "NUTRIRINDE": 20, "FORMULAS INFANTILES": 0
  };
  const FOCO = ["CALDOS", "CHOCOLATES", "CERELAC", "LA CAMPESINA", "LECHE CONDENSADA"];
  /* Maestro de clientes: Confites (chocolates y galletas) tiene base propia */
  const CONFITES = ["CHOCOLATES", "GALLETAS"];
  const MAESTROS = { general: 1028, confites: 1297, nestle: 1574 };
  /* Cartera asignada por vendedor: A&B (alimentos y bebidas) y Confites.
     Es la cuota de activación del mes; sustituye a la cartera deducida del archivo. */
  const CARTERAS = {
    "SUGEI VEGA":         { ab: 92,  conf: 81, tot: 121,  sup: "SARA VELASQUEZ" },
    "MANUEL MONTILLA":    { ab: 69,  conf: 108, tot: 139, sup: "SARA VELASQUEZ" },
    "JEFFERSON PRIETO":   { ab: 84,  conf: 93, tot: 107,  sup: "SARA VELASQUEZ" },
    "RICARDO GONZALEZ":   { ab: 71,  conf: 74, tot: 86,  sup: "SARA VELASQUEZ" },
    "BETZI SANCHEZ":      { ab: 75,  conf: 79, tot: 98,  sup: "RORAIMA SALAZAR" },
    "MAYLIN GUTIERREZ":   { ab: 74,  conf: 71, tot: 99,  sup: "RORAIMA SALAZAR" },
    "ENLLYS NAVARRO":     { ab: 21,  conf: 51, tot: 56,  sup: "RORAIMA SALAZAR" },
    "JEINNY NIETO":       { ab: 59,  conf: 97, tot: 110,  sup: "RORAIMA SALAZAR" },
    "DEYBER ALCANTARA":   { ab: 80,  conf: 82, tot: 103,  sup: "DANNY LA CRUZ" },
    "LUIS FRIAS":         { ab: 96,  conf: 106, tot: 124, sup: "DANNY LA CRUZ" },
    "ZULEXIS MENDOZA":    { ab: 81,  conf: 105, tot: 124, sup: "DANNY LA CRUZ" },
    "ALEXANDER BORGES":   { ab: 55,  conf: 104, tot: 111, sup: "DANNY LA CRUZ" },
    "LISBETH FERRER":     { ab: 18,  conf: 45, tot: 50,  sup: "RICARDO TEIXEIRA" },
    "MARY SUAREZ":        { ab: 14,  conf: 43, tot: 55,  sup: "RICARDO TEIXEIRA" },
    "YEISON UMBRIA":      { ab: 52,  conf: 48, tot: 54,  sup: "DIRECTO OFICINA" },
    "KEIBER BETANCOURT":  { ab: 65,  conf: 65, tot: 93,  sup: "DIRECTO OFICINA" },
    "FRANCHESKA SANCHEZ": { ab: 8,   conf: 20, tot: 20,  sup: "DIRECTO OFICINA" },
    "DIRECTO OFICINA":    { ab: 7,   conf: 9, tot: 12,   sup: "DIRECTO OFICINA" },
    "VENEJUGOS EMPLEADOS":{ ab: 0,   conf: 0, tot: 0,   sup: "DIRECTO OFICINA" }
  };
  const ALIAS_VEND = { "DIRECTO": "DIRECTO OFICINA" };
  /* Cuota de kilos del mes por vendedor (rolling Nestlé) */
  const CUOTAS_VEND_KG = {
    "SUGEI VEGA": 1200, "MANUEL MONTILLA": 600, "JEFFERSON PRIETO": 1100, "RICARDO GONZALEZ": 510,
    "BETZI SANCHEZ": 848, "MAYLIN GUTIERREZ": 950, "ENLLYS NAVARRO": 350, "JEINNY NIETO": 475,
    "DEYBER ALCANTARA": 680, "LUIS FRIAS": 550, "ZULEXIS MENDOZA": 537, "ALEXANDER BORGES": 950,
    "LISBETH FERRER": 750, "MARY SUAREZ": 350,
    "YEISON UMBRIA": 3300, "KEIBER BETANCOURT": 2800, "FRANCHESKA SANCHEZ": 50,
    "DIRECTO OFICINA": 0, "VENEJUGOS EMPLEADOS": 0
  };
  const carteraDe = nombre => CARTERAS[ALIAS_VEND[norm(nombre)] || norm(nombre)] || null;

  /* Cuota de kilos del mes por categoría (editable desde el panel administrativo) */
  const CUOTAS_KG = {
    "CALDOS": 3706, "CHOCOLATES": 3812, "CERELAC": 1311,
    "LA CAMPESINA": 789, "LECHE CONDENSADA": 350
  };

  /* Tipo de documento:
     0 = factura activa
     1 = nota de crédito de tesorería o administrativa (NCTESO): se excluye del cálculo
     2 = nota de crédito ligada a una factura de origen: netea monto y kilos,
         pero nunca desactiva la categoría */
  const TIPO_DOC = { FACTURA: 0, NC_TESORERIA: 1, NC_LIGADA: 2 };
  const NC_ADMIN = /^(NCTESO|NCADM|NCTES|NCA)/;
  function tipoDocumento(doc, origen) {
    const d = String(doc == null ? "" : doc).toUpperCase().trim();
    if (!/^N[CD]/.test(d)) return TIPO_DOC.FACTURA;
    if (NC_ADMIN.test(d)) return TIPO_DOC.NC_TESORERIA;
    return String(origen || "").trim() ? TIPO_DOC.NC_LIGADA : TIPO_DOC.NC_TESORERIA;
  }

  /* Solo se procesa la data de Nestlé: si la fila identifica proveedor, categoría o
     tipo de inventario y ninguno menciona Nestlé, la línea se descarta. */
  function esNestle(cat, tipoInv, prov) {
    const campos = [cat, tipoInv, prov].map(v => String(v == null ? "" : v).toUpperCase());
    if (campos.every(v => !v.trim())) return true;
    return campos.some(v => v.indexOf("NESTL") > -1);
  }

  function norm(s) {
    return String(s == null ? "" : s)
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toUpperCase().trim().replace(/\s+/g, " ");
  }

  function num(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return isFinite(v) ? v : 0;
    let s = String(v).trim().replace(/\s|\u00A0/g, "");
    const coma = s.lastIndexOf(","), punto = s.lastIndexOf(".");
    if (coma > -1 && punto > -1) {
      s = coma > punto ? s.replace(/\./g, "").replace(",", ".")   // 1.234,56
                       : s.replace(/,/g, "");                      // 1,234.56
    } else if (coma > -1) {
      s = (s.length - coma - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* fecha "dd/mm/aaaa" -> {y,m,d,key} ; también acepta Date */
  function parseFecha(v) {
    if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
    const s = String(v).trim().split(" ")[0];
    let p = s.split(/[\/\-]/).map(Number);
    if (p.length < 3 || p.some(isNaN)) return null;
    if (p[0] > 31) return { y: p[0], m: p[1], d: p[2] };      // aaaa-mm-dd
    return { y: p[2], m: p[1], d: p[0] };                      // dd/mm/aaaa
  }
  const pad = n => String(n).padStart(2, "0");

  function diasHabiles(y, m) {
    const n = new Date(y, m, 0).getDate();
    let c = 0;
    for (let d = 1; d <= n; d++) { const w = new Date(y, m - 1, d).getDay(); if (w !== 0 && w !== 6) c++; }
    return c;
  }

  /* ---------- MAPEO TOLERANTE DE COLUMNAS ---------- */
  const llave = s => norm(s).replace(/[^A-Z0-9]/g, "");
  const CAMPOS = {
    sub: ["DescrSubCategoría", "DescrSubCategoria", "SubCategoría", "Subcategoria"],
    fecha: ["FechaFactura", "Fecha"],
    cli: ["CódigoCliente", "CodigoCliente", "CodCliente", "RucCliente"],
    nom: ["RazónSocial", "RazonSocial", "NombreCliente", "Cliente"],
    ruc: ["RucCliente", "RUC", "RIF", "RifCliente", "Cedula", "Cédula"],
    zona: ["DescZona", "Zona", "DescrZona"],
    vend: ["NombreVend", "Vendedor", "NombreVendedor"],
    sup: ["NombSuperv", "NombreSuperv", "Supervisor"],
    kilos: ["Kilos", "PesoNeto", "Peso Neto"],
    venta: ["PrecioTotal", "Precio Total", "Total con IVA"],
    cant: ["Cantidad", "CantidadEnUnidadInventario"],
    doc: ["NúmeroFactura", "NumeroFactura", "Documento", "NroDocumento"],
    docOrigen: ["FacturaOrigen", "DocumentoOrigen", "NúmeroFacturaOrigen", "NumeroFacturaOrigen", "DocOrigen"],
    cat: ["DescrCategoría", "DescrCategoria", "Categoría", "Categoria"],
    tipoInv: ["DescrTipoInv", "TipoInventario", "DescTipoInv"],
    prov: ["NombreProv", "Proveedor", "NombreProveedor"]
  };
  function mapaColumnas(filas) {
    const claves = filas.length ? Object.keys(filas[0]) : [];
    const M = {};
    Object.entries(CAMPOS).forEach(([k, alts]) => {
      let hallado = null;
      for (const a of alts) { hallado = claves.find(c => llave(c) === llave(a)); if (hallado) break; }
      M[k] = hallado || null;
    });
    M.faltantes = Object.entries(M).filter(([k, v]) => k !== "faltantes" && !v).map(([k]) => k);
    return M;
  }

  /* El archivo puede declarar mal su rango: recalcular a partir de las celdas reales */
  function repararHoja(ws) {
    let maxR = 0, maxC = 0;
    Object.keys(ws).forEach(k => {
      if (k[0] === "!") return;
      const c = XLSX.utils.decode_cell(k);
      if (c.r > maxR) maxR = c.r;
      if (c.c > maxC) maxC = c.c;
    });
    ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    return { filas: maxR + 1, columnas: maxC + 1 };
  }

  /* días hábiles del 1° del mes hasta la fecha de corte (incluida) */
  function habilesHasta(y, m, d) {
    let c = 0;
    for (let i = 1; i <= d; i++) { const w = new Date(y, m - 1, i).getDay(); if (w !== 0 && w !== 6) c++; }
    return c;
  }

  /* fecha de corte: la indicada por la administración o el último día facturado */
  function corteDe(ds, corte) {
    const ult = parseFecha(ds.dias[ds.dias.length - 1]) || { y: ds.anio, m: ds.mesNum, d: 1 };
    const c = corte ? parseFecha(corte) : null;
    return (c && c.y === ds.anio && c.m === ds.mesNum) ? c : ult;
  }

  /* ---------- EMPAQUETADO: filas del Excel -> dataset compacto ---------- */
  function pack(filas, nombreArchivo) {
    const K = mapaColumnas(filas);
    const subs = [], clientes = [], zonas = [], vends = [], dias = [], supers = [], clientesNom = [], clientesRuc = [];
    const supDeVend = [];
    const iSup = new Map();
    const iSub = new Map(), iCli = new Map(), iZon = new Map(), iVen = new Map(), iDia = new Map();
    const idx = (map, arr, val) => {
      if (!map.has(val)) { map.set(val, arr.length); arr.push(val); }
      return map.get(val);
    };
    const r = [];
    let y = 0, m = 0, descartadas = 0;

    const V = (f, k, def) => (K[k] && f[K[k]] != null && f[K[k]] !== "") ? f[K[k]] : def;
    filas.forEach(f => {
      const sub = norm(V(f, "sub", ""));
      if (!sub) return;
      if (!esNestle(V(f, "cat", ""), V(f, "tipoInv", ""), V(f, "prov", ""))) { descartadas++; return; }
      const fe = parseFecha(V(f, "fecha", ""));
      const dk = fe ? `${pad(fe.d)}/${pad(fe.m)}/${fe.y}` : "s/f";
      if (fe) { y = fe.y; m = fe.m; }
      const cIdx = idx(iCli, clientes, String(V(f, "cli", "SIN CLIENTE")).trim());
      if (!clientesNom[cIdx]) clientesNom[cIdx] = String(V(f, "nom", "")).trim();
      if (!clientesRuc[cIdx]) clientesRuc[cIdx] = String(V(f, "ruc", "")).trim();
      const vIdx = idx(iVen, vends, String(V(f, "vend", "SIN VENDEDOR")).trim() || "SIN VENDEDOR");
      const sIdx = idx(iSup, supers, (String(V(f, "sup", "SIN SUPERVISOR")).trim() || "SIN SUPERVISOR").toUpperCase());
      if (supDeVend[vIdx] == null) supDeVend[vIdx] = sIdx;
      r.push([
        cIdx,
        idx(iZon, zonas, String(V(f, "zona", "SIN ZONA")).trim() || "SIN ZONA"),
        vIdx,
        idx(iSub, subs, sub),
        idx(iDia, dias, dk),
        Math.round(num(V(f, "kilos", 0)) * 1000) / 1000,
        Math.round(num(V(f, "venta", 0)) * 100) / 100,
        Math.round(num(V(f, "cant", 0))),
        tipoDocumento(V(f, "doc", ""), V(f, "docOrigen", ""))
      ]);
    });

    /* reordenar días cronológicamente y remapear */
    const orden = dias.map((d, i) => ({ d, i })).sort((a, b) => {
      const A = a.d.split("/"), B = b.d.split("/");
      return (A[2] + A[1] + A[0]).localeCompare(B[2] + B[1] + B[0]);
    });
    const remap = {}; orden.forEach((o, k) => remap[o.i] = k);
    const dias2 = orden.map(o => o.d);
    r.forEach(row => row[4] = remap[row[4]]);

    return {
      archivo: nombreArchivo || "archivo.xlsx",
      generado: new Date().toLocaleString("es-VE"), ts: Date.now(),
      mes: `${pad(m)}/${y}`, anio: y, mesNum: m, columnas: K, descartadas,
      subs, clientes, clientesNom, clientesRuc, zonas, vends, supers, supDeVend, dias: dias2, r
    };
  }

  /* ---------- CÁLCULO ---------- */
  function compute(ds, opt) {
    opt = opt || {};
    const zonaF = opt.zona && opt.zona !== "TODAS" ? ds.zonas.indexOf(opt.zona) : -1;
    const vendF = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const rows = ds.r.filter(x => (zonaF < 0 || x[1] === zonaF) && (vendF < 0 || x[2] === vendF))
      .filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);   /* regla 1 */

    const cuotasKg = Object.assign({}, CUOTAS_KG, opt.cuotasKg || {});
    const cuotaUsd = num(opt.cuotaUsd) || 0;

    const univSet = new Set(rows.map(x => x[0]));
    const sinFiltro = zonaF < 0 && vendF < 0;
    const univGen = (sinFiltro && num(opt.universo) > 0) ? num(opt.universo)
      : (sinFiltro ? MAESTROS.general : univSet.size);
    const univConf = (sinFiltro && num(opt.universoConfites) > 0) ? num(opt.universoConfites)
      : (sinFiltro ? MAESTROS.confites : univSet.size);
    const universoDe = sub => CONFITES.indexOf(sub) > -1 ? univConf : univGen;
    const universo = univGen;
    const baseNestle = (sinFiltro && num(opt.baseNestle) > 0) ? num(opt.baseNestle) : MAESTROS.nestle;

    const corte = corteDe(ds, opt.corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, corte.d) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum) || diasTrans;
    const factor = habiles / diasTrans;

    const acumula = () => ({ kilos: 0, venta: 0, unid: 0, cli: new Set() });
    const glob = acumula();
    const cliGeneral = new Set(), cliConfites = new Set();
    const porSub = new Map();
    const porZona = new Map();
    const porVend = new Map();
    const porCli = new Map();
    const serie = ds.dias.map(d => ({ fecha: d.slice(0, 5), kilos: 0, venta: 0, cli: new Set() }));
    const serieFoco = {}; FOCO.forEach(s => serieFoco[s] = ds.dias.map(() => 0));

    rows.forEach(x => {
      const [c, z, v, s, d, kg, us, un] = x;
      const sub = ds.subs[s];
      const factura = (x[8] || 0) === TIPO_DOC.FACTURA;   /* regla 3 */
      glob.kilos += kg; glob.venta += us; glob.unid += un;
      if (factura && us > 0) { glob.cli.add(c); (CONFITES.indexOf(ds.subs[s]) > -1 ? cliConfites : cliGeneral).add(c); }

      if (!porSub.has(sub)) porSub.set(sub, acumula());
      const S = porSub.get(sub); S.kilos += kg; S.venta += us; S.unid += un; if (factura && us > 0) S.cli.add(c);

      const zn = ds.zonas[z];
      if (!porZona.has(zn)) porZona.set(zn, acumula());
      const Z = porZona.get(zn); Z.kilos += kg; Z.venta += us; if (factura && us > 0) Z.cli.add(c);

      const vn = ds.vends[v];
      if (!porVend.has(vn)) porVend.set(vn, acumula());
      const V = porVend.get(vn); V.kilos += kg; V.venta += us; if (factura && us > 0) V.cli.add(c);

      const cn = ds.clientes[c];
      if (!porCli.has(cn)) porCli.set(cn, acumula());
      const C = porCli.get(cn); C.kilos += kg; C.venta += us;

      serie[d].kilos += kg; serie[d].venta += us; if (factura && us > 0) serie[d].cli.add(c);
      if (serieFoco[sub]) serieFoco[sub][d] += kg;
    });

    const fila = (sub) => {
      const S = porSub.get(sub) || acumula();
      const act = S.cli.size;
      const univ = universoDe(sub);
      const pct = univ ? 100 * act / univ : 0;
      const tgt = TARGETS[sub];
      const req = tgt != null ? Math.ceil(univ * tgt / 100) : null;
      const cuotaCat = num(cuotasKg[sub]) || 0;
      return {
        cat: sub, activados: act, universo: univ, pct: pct, target: tgt != null ? tgt : null,
        requeridos: req, faltan: req != null ? Math.max(0, req - act) : null,
        cumpl: tgt ? 100 * pct / tgt : (tgt === 0 ? 100 : null),
        kilos: S.kilos, kilosProy: S.kilos * factor,
        cuotaKg: cuotaCat,
        cumplKg: cuotaCat ? 100 * S.kilos / cuotaCat : null,
        cumplKgProy: cuotaCat ? 100 * S.kilos * factor / cuotaCat : null,
        faltanteKg: cuotaCat ? Math.max(0, cuotaCat - S.kilos) : null,
        faltanteKgProy: cuotaCat ? cuotaCat - S.kilos * factor : null,
        venta: S.venta, ventaProy: S.venta * factor, unid: S.unid
      };
    };

    const foco = FOCO.map(fila);
    const todas = Array.from(porSub.keys()).sort().map(fila);

    let acK = 0, acV = 0;
    const serieOut = serie.map(s => { acK += s.kilos; acV += s.venta; return { fecha: s.fecha, kilos: s.kilos, venta: s.venta, kilosAcum: acK, ventaAcum: acV, clientes: s.cli.size }; });

    const lista = (map, key) => Array.from(map.entries())
      .map(([k, v]) => ({ [key]: k, kilos: v.kilos, venta: v.venta, clientes: v.cli ? v.cli.size : 0 }))
      .sort((a, b) => b.kilos - a.kilos);

    const kilosFoco = foco.reduce((a, r) => a + r.kilos, 0);
    const kilosFocoProy = kilosFoco * factor;
    const cuotaKg = foco.reduce((a, r) => a + r.cuotaKg, 0);
    const activados = glob.cli.size;
    const catsConTarget = todas.filter(t => t.target != null && t.target > 0);
    const cumplPond = catsConTarget.length
      ? catsConTarget.reduce((a, t) => a + Math.min(100, t.cumpl), 0) / catsConTarget.length : 0;
    const cumplFoco = foco.reduce((a, t) => a + Math.min(100, t.cumpl || 0), 0) / (foco.length || 1);

    return {
      meta: {
        archivo: ds.archivo, generado: ds.generado, mes: ds.mes,
        desde: ds.dias[0], hasta: ds.dias[ds.dias.length - 1],
        diasTrans, habiles, factor, registros: rows.length,
        corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}`,
        zona: opt.zona || "TODAS", vendedor: opt.vendedor || "TODOS",
        universoManual: sinFiltro, univGen, univConf
      },
      glob: {
        universo, univGen, univConf, baseNestle, activados,
        noActivados: Math.max(0, baseNestle - activados),
        pctAct: baseNestle ? 100 * activados / baseNestle : 0,
        actGeneral: cliGeneral.size, pctGeneral: univGen ? 100 * cliGeneral.size / univGen : 0,
        actConfites: cliConfites.size, pctConfites: univConf ? 100 * cliConfites.size / univConf : 0,
        kilos: glob.kilos, kilosProy: glob.kilos * factor,
        kilosFoco, kilosFocoProy,
        venta: glob.venta, ventaProy: glob.venta * factor, unid: glob.unid,
        cuotaKg, cuotaUsd, cuotasKg,
        faltanteKg: Math.max(0, cuotaKg - kilosFoco),
        faltanteKgProy: cuotaKg - kilosFocoProy,
        cumplKg: cuotaKg ? 100 * kilosFoco / cuotaKg : null,
        cumplKgProy: cuotaKg ? 100 * kilosFocoProy / cuotaKg : null,
        faltanteUsd: Math.max(0, cuotaUsd - glob.venta),
        cumplUsd: cuotaUsd ? 100 * glob.venta / cuotaUsd : null,
        cumplUsdProy: cuotaUsd ? 100 * glob.venta * factor / cuotaUsd : null,
        cumplPond, cumplFoco
      },
      foco, todas, serie: serieOut, serieFoco,
      zonas: lista(porZona, "zona"),
      vendedores: lista(porVend, "vendedor"),
      clientes: lista(porCli, "cliente").slice(0, 15),
      listaZonas: ds.zonas.slice().sort(),
      listaVends: ds.vends.slice().sort()
    };
  }

  /* ---------- PERFORMANCE POR VENDEDOR Y SUPERVISOR ---------- */
  function computeVend(ds, opt) {
    opt = opt || {};
    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const tgt = cat === "TODAS" ? 100 : (TARGETS[cat] != null ? TARGETS[cat] : 100);
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    /* solo asesores con cartera asignada: el resto queda fuera del reporte */
    const asignados = new Set(ds.vends.map((n, i) => carteraDe(n) ? i : -1).filter(i => i >= 0));
    const filas = vFil < 0 ? ds.r.filter(x => asignados.has(x[2])) : ds.r.filter(x => x[2] === vFil);

    const corte = corteDe(ds, opt.corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, corte.d) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum) || diasTrans;
    const restantes = Math.max(1, habiles - diasTrans);
    const porDia = faltan => faltan / restantes;

    /* --- por vendedor, en la categoría seleccionada --- */
    const cartera = {}, activos = {};
    filas.forEach(x => {
      const [c, z, v, s, d, kg, us] = x;
      (cartera[v] = cartera[v] || new Set()).add(c);
      if ((x[8] || 0) === TIPO_DOC.FACTURA && us > 0 && (cat === "TODAS" || ds.subs[s] === cat))
        (activos[v] = activos[v] || new Set()).add(c);
    });

    const esConf = c => CONFITES.indexOf(c) > -1;
    /* En "todas las categorías" la base es el maestro Nestlé cargado en el panel
       administrativo, repartido entre los asesores en proporción a su cartera. */
    const baseCat = (C, categoria) => categoria === "TODAS" ? C.tot
      : (esConf(categoria) ? C.conf : C.ab);

    const vendedores = ds.vends.map((nom, i) => {
      const atendida = cartera[i] ? cartera[i].size : 0;
      const C = carteraDe(nom);
      const base = C ? baseCat(C, cat) : atendida;
      const act = activos[i] ? activos[i].size : 0;
      const meta = Math.round(base * tgt / 100);
      const faltan = Math.max(0, meta - act);
      return {
        vendedor: nom,
        supervisor: C ? C.sup : "SIN ASIGNACION EN CARTERA",
        asignada: !!C, atendida,
        cartera: base, meta, activados: act, faltan,
        pctAct: base ? 100 * act / base : null,
        pendienteAct: base ? 100 * faltan / base : null,
        pct: meta ? 100 * act / meta : null,
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : null,
        porDia: porDia(faltan)
      };
    }).filter(v => v.asignada && (v.cartera > 0 || v.atendida > 0));

    const mapa = new Map();
    vendedores.forEach(v => {
      if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, { supervisor: v.supervisor, cartera: 0, meta: 0, activados: 0, equipo: [] });
      const S = mapa.get(v.supervisor);
      S.cartera += v.cartera; S.meta += v.meta; S.activados += v.activados;
      S.equipo.push(v);
    });
    const supervisores = Array.from(mapa.values()).map(S => {
      S.equipo.sort((a, b) => (b.pct || 0) - (a.pct || 0));
      S.pct = S.meta ? 100 * S.activados / S.meta : null;
      S.pendiente = S.pct == null ? null : Math.max(0, 100 - S.pct);
      S.faltan = S.equipo.reduce((a, v) => a + v.faltan, 0);
      S.pctAct = S.cartera ? 100 * S.activados / S.cartera : null;
      S.pendienteAct = S.cartera ? 100 * S.faltan / S.cartera : null;
      S.porDia = porDia(S.faltan);
      return S;
    }).sort((a, b) => (b.pct || 0) - (a.pct || 0));

    const tot = vendedores.reduce((a, v) => ({ cartera: a.cartera + v.cartera, meta: a.meta + v.meta, activados: a.activados + v.activados }), { cartera: 0, meta: 0, activados: 0 });
    /* en la vista general la base es el maestro Nestlé; la diferencia con la suma de
       carteras son clientes de la base que no están en ninguna cartera del equipo */
    const baseNestle = num(opt.baseNestle) > 0 ? num(opt.baseNestle) : MAESTROS.nestle;
    tot.sinCartera = 0;
    if (cat === "TODAS" && vFil < 0 && baseNestle > tot.cartera) {
      tot.sinCartera = baseNestle - tot.cartera;
      tot.cartera = baseNestle;
      tot.meta = Math.round(baseNestle * tgt / 100);
    }
    tot.pct = tot.meta ? 100 * tot.activados / tot.meta : null;
    tot.pendiente = tot.pct == null ? null : Math.max(0, 100 - tot.pct);
    tot.faltan = vendedores.reduce((a, v) => a + v.faltan, 0) + tot.sinCartera;
    tot.pctAct = tot.cartera ? 100 * tot.activados / tot.cartera : null;
    tot.pendienteAct = tot.cartera ? 100 * tot.faltan / tot.cartera : null;
    tot.porDia = porDia(tot.faltan);

    /* --- por categoría, para el alcance filtrado --- */
    const alcance = vFil < 0 ? ds.vends.filter((n, i) => asignados.has(i)) : [ds.vends[vFil]];
    const sumaBase = tipo => alcance.reduce((a, nom) => {
      const C = carteraDe(nom);
      return a + (C ? C[tipo] : 0);
    }, 0);
    const baseAB = sumaBase("ab") || new Set(filas.map(x => x[0])).size;
    const baseConf = sumaBase("conf") || baseAB;
    const baseTot = sumaBase("tot") || baseAB;
    const carteraTotal = Math.max(baseAB, baseConf);
    const actCat = {};
    filas.forEach(x => { if (x[6] > 0 && (x[8] || 0) === TIPO_DOC.FACTURA) (actCat[ds.subs[x[3]]] = actCat[ds.subs[x[3]]] || new Set()).add(x[0]); });

    const porCategoria = Object.keys(TARGETS).map(c => {
      const target = TARGETS[c];
      const act = actCat[c] ? actCat[c].size : 0;
      const baseCategoria = CONFITES.indexOf(c) > -1 ? baseConf : baseAB;
      const meta = Math.round(baseCategoria * target / 100);
      const faltan = Math.max(0, meta - act);
      return {
        cat: c, target, cartera: baseCategoria, meta, activados: act, faltan,
        pctCartera: baseCategoria ? 100 * act / baseCategoria : 0,
        pct: meta ? 100 * act / meta : (target === 0 ? 100 : null),
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : 0,
        porDia: porDia(faltan)
      };
    });

    return {
      categoria: cat, target: tgt, vendedor: opt.vendedor || "TODOS",
      supervisores, vendedores, porCategoria, total: tot,
      bases: { ab: baseAB, confites: baseConf, total: baseTot, nestle: baseNestle },
      dias: { transcurridos: diasTrans, habiles, restantes, corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}` },
      meta: { archivo: ds.archivo, desde: ds.dias[0], hasta: ds.dias[ds.dias.length - 1], mes: ds.mes }
    };
  }

  /* ---------- CLIENTES ACTIVADOS ---------- */
  /* Activado = el cliente registra un monto mayor a cero en la categoría evaluada. */
  function clientesDe(ds, opt) {
    opt = opt || {};
    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const asignados = new Set(ds.vends.map((n, i) => carteraDe(n) ? i : -1).filter(i => i >= 0));
    const filas = (vFil < 0 ? ds.r.filter(x => asignados.has(x[2])) : ds.r.filter(x => x[2] === vFil))
      .filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);

    const mapa = new Map();
    filas.forEach(x => {
      const [c, z, v, s, d, kg, us] = x;
      if (!mapa.has(c)) mapa.set(c, {
        codigo: ds.clientes[c], nombre: (ds.clientesNom || [])[c] || ds.clientes[c],
        ruc: (ds.clientesRuc || [])[c] || "",
        vendedor: ds.vends[v], zona: ds.zonas[z],
        supervisor: (carteraDe(ds.vends[v]) || {}).sup || "SIN ASIGNACION",
        monto: 0, kilos: 0, montoTotal: 0, dia: -1, facturas: 0, conFactura: false
      });
      const C = mapa.get(c);
      C.montoTotal += us;
      if (cat === "TODAS" || ds.subs[s] === cat) {
        C.monto += us; C.kilos += kg;
        if ((x[8] || 0) === TIPO_DOC.FACTURA) {
          C.facturas++;
          if (us > 0) C.conFactura = true;          /* regla 3 */
          if (d > C.dia) C.dia = d;
        }
      }
    });

    const lista = Array.from(mapa.values()).map(C => {
      C.activado = C.conFactura;
      C.ultima = C.dia >= 0 ? ds.dias[C.dia] : "—";
      return C;
    }).sort((a, b) => b.monto - a.monto || a.nombre.localeCompare(b.nombre));

    return {
      categoria: cat, vendedor: opt.vendedor || "TODOS", lista,
      activados: lista.filter(c => c.activado).length,
      atendidos: lista.length,
      kilos: lista.reduce((a, c) => a + c.kilos, 0),
      monto: lista.reduce((a, c) => a + c.monto, 0)
    };
  }

  /* ---------- ROLLING NESTLÉ EN KILOS ---------- */
  function rolling(ds, opt) {
    opt = opt || {};
    const corte = corteDe(ds, opt.corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, corte.d) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum) || diasTrans;
    const restantes = Math.max(1, habiles - diasTrans);
    const tt = diasTrans / habiles;                       /* tiempo transcurrido */
    const diaCorte = ds.dias.indexOf(`${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}`);

    /* el rolling de kilos incluye a todos los vendedores: mide la venta total de Venejugos */
    const mes = {}, dia = {};
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA) return;
      mes[x[2]] = (mes[x[2]] || 0) + x[5];
      if (x[4] === diaCorte) dia[x[2]] = (dia[x[2]] || 0) + x[5];
    });

    const vendedores = ds.vends.map((nom, i) => {
      if (!mes[i] && !CUOTAS_VEND_KG[ALIAS_VEND[norm(nom)] || norm(nom)]) return null;
      const cuota = CUOTAS_VEND_KG[ALIAS_VEND[norm(nom)] || norm(nom)] || 0;
      const venta = mes[i] || 0;
      const proy = venta / tt;
      const falta = Math.max(0, cuota - venta);
      return {
        vendedor: nom,
        supervisor: (carteraDe(nom) || {}).sup || "SIN CARTERA ASIGNADA",
        cuota, ventaDia: dia[i] || 0, venta,
        cumpl: cuota ? 100 * venta / cuota : null,
        necesidad: cuota ? falta / restantes : 0,
        proyeccion: proy,
        cumplProy: cuota ? 100 * proy / cuota : null,
        falta
      };
    }).filter(Boolean);

    const suma = arr => arr.reduce((a, v) => ({
      cuota: a.cuota + v.cuota, ventaDia: a.ventaDia + v.ventaDia, venta: a.venta + v.venta,
      necesidad: a.necesidad + v.necesidad, proyeccion: a.proyeccion + v.proyeccion, falta: a.falta + v.falta
    }), { cuota: 0, ventaDia: 0, venta: 0, necesidad: 0, proyeccion: 0, falta: 0 });

    const mapa = new Map();
    vendedores.forEach(v => {
      if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, []);
      mapa.get(v.supervisor).push(v);
    });
    const supervisores = Array.from(mapa.entries()).map(([sup, equipo]) => {
      const S = suma(equipo);
      S.supervisor = sup; S.equipo = equipo;
      S.cumpl = S.cuota ? 100 * S.venta / S.cuota : null;
      S.cumplProy = S.cuota ? 100 * S.proyeccion / S.cuota : null;
      return S;
    }).sort((a, b) => (b.cumpl || 0) - (a.cumpl || 0));

    const total = suma(vendedores);
    total.cumpl = total.cuota ? 100 * total.venta / total.cuota : null;
    total.cumplProy = total.cuota ? 100 * total.proyeccion / total.cuota : null;

    return {
      vendedores, supervisores, total,
      dias: { transcurridos: diasTrans, habiles, restantes, tt: 100 * tt,
              corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}` }
    };
  }

  /* ---------- CARGA DEL DATASET ----------
     Orden: siempre primero dataset.json del repositorio, sin caché.
     localStorage solo si la descarga falla (archivo abierto sin servidor). */
  const leerLocal = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };

  async function cargarDataset(base) {
    let error = null;
    try {
      const res = await fetch("dataset.json?v=" + Date.now(), {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
      });
      if (res.ok) {
        const j = await res.json();
        if (j && j.r) return { ds: j, origen: "repositorio", error: null };
        error = "dataset.json no tiene el formato esperado";
      } else error = "dataset.json respondió " + res.status;
    } catch (e) { error = e.message; }

    const local = leerLocal("vj_dataset");
    if (local && local.r) return { ds: local, origen: "navegador", error };
    return { ds: base, origen: "archivo base", error };
  }

  function sello(ds, origen) {
    return `${ds.archivo || "sin archivo"} · ${ds.publicado || ds.generado || "sin fecha"} · ${origen}`;
  }

  /* ---------- AVANCE SEMANAL Y DÉFICIT PROGRESIVO ----------
     La cuota del mes se divide entre la cantidad de semanas del mes en curso.
     Semana = bloque de lunes a viernes; la meta acumulada de la semana k es
     cuota x k / semanas, y el déficit es lo que falta contra esa meta. */
  function semanasDelMes(y, m) {
    const n = new Date(y, m, 0).getDate();
    const sem = [];
    let actual = null;
    for (let d = 1; d <= n; d++) {
      const f = new Date(y, m - 1, d), w = f.getDay();
      if (w === 0 || w === 6) continue;
      if (!actual || w === 1) { actual = { n: sem.length + 1, desde: d, hasta: d, dias: 0 }; sem.push(actual); }
      actual.hasta = d; actual.dias++;
    }
    return sem;
  }

  function semanal(ds, opt) {
    opt = opt || {};
    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const tgt = cat === "TODAS" ? 100 : (TARGETS[cat] != null ? TARGETS[cat] : 100);
    const esConf = CONFITES.indexOf(cat) > -1;
    const corte = corteDe(ds, opt.corte);
    const sem = semanasDelMes(ds.anio, ds.mesNum);
    const total = sem.length;

    /* día del mes de cada índice de fecha del dataset */
    const diaDelMes = ds.dias.map(f => parseInt(String(f).split("/")[0], 10));
    const semanaDe = d => {
      const dm = diaDelMes[d];
      for (let i = 0; i < sem.length; i++) if (dm >= sem[i].desde && dm <= sem[i].hasta) return i;
      return sem.length - 1;
    };
    const semActual = (() => {
      for (let i = 0; i < sem.length; i++) if (corte.d >= sem[i].desde && corte.d <= sem[i].hasta) return i;
      return sem.length - 1;
    })();

    const porVend = {};
    ds.r.forEach(x => {
      const [c, z, v, s, d, kg, us] = x;
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA) return;
      const nom = ds.vends[v];
      if (!porVend[nom]) porVend[nom] = { kilos: sem.map(() => 0), cli: sem.map(() => new Set()) };
      const k = semanaDe(d);
      porVend[nom].kilos[k] += kg;
      if ((x[8] || 0) === TIPO_DOC.FACTURA && us > 0 && (cat === "TODAS" || ds.subs[s] === cat))
        porVend[nom].cli[k].add(c);
    });

    const filas = Object.keys(porVend).map(nom => {
      const C = carteraDe(nom);
      if (!C) return null;
      const base = cat === "TODAS" ? C.tot : (esConf ? C.conf : C.ab);
      const metaCli = Math.round(base * tgt / 100);
      const cuotaKg = CUOTAS_VEND_KG[ALIAS_VEND[norm(nom)] || norm(nom)] || 0;
      const D = porVend[nom];

      const vistos = new Set();
      let kgAcum = 0;
      const semanas = sem.map((S, k) => {
        D.cli[k].forEach(c => vistos.add(c));
        kgAcum += D.kilos[k];
        const metaKgAcum = cuotaKg * (k + 1) / total;
        const metaCliAcum = metaCli * (k + 1) / total;
        const transcurrida = k <= semActual;
        return {
          semana: S.n, desde: S.desde, hasta: S.hasta, dias: S.dias, transcurrida,
          kilos: D.kilos[k], kilosAcum: kgAcum,
          metaKg: cuotaKg / total, metaKgAcum,
          deficitKg: transcurrida ? Math.max(0, metaKgAcum - kgAcum) : 0,
          clientesSem: D.cli[k].size, clientesAcum: vistos.size,
          metaCli: metaCli / total, metaCliAcum,
          deficitCli: transcurrida ? Math.max(0, Math.round(metaCliAcum - vistos.size)) : 0
        };
      });

      const ult = semanas[semActual];
      return {
        vendedor: nom, supervisor: C.sup, cartera: base, metaCli, cuotaKg, semanas,
        deficitKg: ult.deficitKg, deficitCli: ult.deficitCli,
        kilosAcum: ult.kilosAcum, clientesAcum: ult.clientesAcum,
        cumplKg: ult.metaKgAcum ? 100 * ult.kilosAcum / ult.metaKgAcum : null,
        cumplCli: ult.metaCliAcum ? 100 * ult.clientesAcum / ult.metaCliAcum : null,
        incumpleKg: ult.deficitKg > 0, incumpleCli: ult.deficitCli > 0
      };
    }).filter(Boolean).sort((a, b) => (b.deficitKg + b.deficitCli * 10) - (a.deficitKg + a.deficitCli * 10));

    const tot = filas.reduce((a, v) => ({
      cuotaKg: a.cuotaKg + v.cuotaKg, kilosAcum: a.kilosAcum + v.kilosAcum,
      deficitKg: a.deficitKg + v.deficitKg, metaCli: a.metaCli + v.metaCli,
      clientesAcum: a.clientesAcum + v.clientesAcum, deficitCli: a.deficitCli + v.deficitCli
    }), { cuotaKg: 0, kilosAcum: 0, deficitKg: 0, metaCli: 0, clientesAcum: 0, deficitCli: 0 });

    return {
      categoria: cat, target: tgt, semanas: sem, total, semActual,
      corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}`,
      filas, totales: tot,
      enDeficit: filas.filter(f => f.incumpleKg || f.incumpleCli)
    };
  }

  /* ---------- FORMATOS ---------- */
  const f0 = n => (n == null || isNaN(n)) ? "—" : Math.round(n).toLocaleString("es-VE");
  const f1 = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("es-VE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fp = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("es-VE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  const fu = n => (n == null || isNaN(n)) ? "—" : "$" + Math.round(n).toLocaleString("es-VE");

  /* ---------- RESUMEN NARRATIVO ---------- */
  function narrativa(M) {
    const g = M.glob, m = M.meta;
    const ord = M.foco.slice().sort((a, b) => (b.cumpl || 0) - (a.cumpl || 0));
    const mejor = ord[0], peor = ord[ord.length - 1];
    const faltanTotal = M.foco.reduce((a, c) => a + (c.faltan || 0), 0);
    const cerradas = M.foco.filter(c => c.cumpl >= 100).length;
    const p = [];

    p.push(`Entre el ${m.desde} y el ${m.hasta} se procesaron ${f0(m.registros)} líneas de facturación sobre un maestro de ${f0(g.univGen)} clientes para el portafolio general y ${f0(g.univConf)} para Confites (chocolates y galletas). Se registraron ${f0(g.activados)} clientes con venta efectiva mayor a cero sobre la base total Nestlé de ${f0(g.baseNestle)}, es decir ${fp(g.pctAct)} de activación, y ${f0(g.noActivados)} clientes sin compra en el período. Por tipo de maestro, el portafolio general alcanza ${f0(g.actGeneral)} clientes sobre ${f0(g.univGen)} (${fp(g.pctGeneral)}) y Confites ${f0(g.actConfites)} sobre ${f0(g.univConf)} (${fp(g.pctConfites)}). El corte cubre ${m.diasTrans} días hábiles de los ${m.habiles} del mes ${m.mes}, por lo que toda proyección se construye con un factor de ${m.factor.toFixed(2)} sobre el ritmo actual.`);

    p.push(`El volumen acumulado de las cinco categorías evaluadas es de ${f1(g.kilosFoco)} kg frente a una cuota de ${f1(g.cuotaKg)} kg, es decir ${fp(g.cumplKg)} de avance real y ${f1(g.faltanteKg)} kg por facturar. De sostenerse el ritmo diario, el mes cerraría en ${f1(g.kilosFocoProy)} kg, ${fp(g.cumplKgProy)} de la cuota, ${g.faltanteKgProy > 0 ? "es decir " + f1(g.faltanteKgProy) + " kg por debajo del objetivo" : "superándolo en " + f1(Math.abs(g.faltanteKgProy)) + " kg"}. El total del portafolio, incluidas las categorías fuera del foco, suma ${f1(g.kilos)} kg, con proyección de ${f1(g.kilosProy)} kg.`);

    const kgDet = M.foco.filter(c => c.cuotaKg).map(c => `${c.cat} ${f1(c.kilos)} de ${f1(c.cuotaKg)} kg (${fp(c.cumplKg)})`).join(" · ");
    if (kgDet) p.push(`Detalle de kilos por categoría — ${kgDet}. Las que cerrarían por debajo de su cuota al ritmo actual son ${M.foco.filter(c => c.cuotaKg && c.faltanteKgProy > 0).map(c => `${c.cat} (${f1(c.faltanteKgProy)} kg)`).join(", ") || "ninguna"}.`);

    return `<svg class="dona" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="#E8EDFB" stroke-width="9"></circle>
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="${color(pct)}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${tam/2} ${tam/2})"></circle>
      <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${tam*0.23}" fill="${color(pct)}">${pct == null ? "—" : Math.round(pct) + "%"}</text>
    </svg>`;
  }

  function tarjetaSup(S){
    const total = S.equipo.reduce((a,v)=>a+v.cartera,0) || 1;
    const cintas = S.equipo.map(v => `<span style="width:${100*v.cartera/total}%;background:${colorV(v)}"></span>`).join("");
    return `<div class="tarjeta c6">
      <div class="sup-cab">
        ${dona(val(S), 74, colorV(S))}
        <div>
          <p class="nom">${S.supervisor}</p>
          <p class="cifra">${f0(S.meta)} / ${f0(S.activados)}<small>meta / activados · cartera ${f0(S.cartera)} · activación ${fp(S.pctAct)} · ${f1(S.porDia)} clientes/día</small></p>
        </div>
      </div>
      <div class="cintas">${cintas}</div>
      <ul class="equipo">
        ${S.equipo.map(v => `<li class="${v.pct != null && v.pct < 70 ? "bajo" : ""}">
          <span class="punto" style="background:${colorV(v)}"></span>
          <span class="quien">${v.vendedor}</span>
          <span class="par"><b>${f0(v.meta)}</b> / <b>${f0(v.activados)}</b> · falta <b>${f0(v.faltan)}</b></span>

        </li>`).join("")}
      </ul>
    </div>`;

        <td><span class="pill ${sem(M.total.pct)}">${fp(M.total.pctAct)}</span></td><td>${fp(M.total.pct)}</td>

    return `

      <h3>Alerta de vendedores</h3>
      <p class="sub">${flojos.length} de ${M.vendedores.length} vendedores por debajo de 70% del target en ${M.categoria === "TODAS" ? "activación general" : M.categoria}</p>
      ${lista(flojos, "Ningún vendedor por debajo del umbral en esta categoría.", v => `<li class="bajo">
        <span class="punto" style="background:${color(v.pct)}"></span>

      <h3>Alerta de activación</h3>
      <p class="sub">Categorías por debajo del target${M.vendedor === "TODOS" ? "" : " para " + M.vendedor} · corte ${M.dias.corte} · ${M.dias.transcurridos} de ${M.dias.habiles} días hábiles · ${M.dias.restantes} restantes</p>
      ${lista(cats, "Todas las categorías alcanzan su target.", c => `<li class="${c.pct < 70 ? "bajo" : ""}">
        <span class="punto" style="background:${color(c.pct)}"></span>
        <span class="quien">${c.cat}<br><span style="font-weight:500;color:var(--gris);font-size:.74rem">target ${c.target}% · activación ${fp(c.pctCartera)}</span></span>
        <span class="par">faltan <b>${f0(c.faltan)}</b> · <b>${f1(c.porDia)}</b>/día</span>

  function tablaCat(M){
    return `<div class="tarjeta c12">
      <h3>Activación por categoría${M.vendedor === "TODOS" ? "" : " · " + M.vendedor}</h3>

          <td><b>${c.cat}</b></td><td>${f0(c.cartera)}</td><td>${c.target}%</td>
          <td><span class="pill ${sem(c.pctCartera >= c.target ? 100 : 100*c.pctCartera/(c.target||100))}">${fp(c.pctCartera)}</span></td>

  let FILTRO_TXT = "", SOLO_ACT = true;

  function tablaClientes(){
    const C = VJ.clientesDe(DS, { categoria: $("fCat").value, vendedor: $("fVend").value });
    const txt = FILTRO_TXT.toLowerCase();
    const filas = C.lista
      .filter(c => SOLO_ACT ? c.activado : true)
      .filter(c => !txt || (c.nombre + " " + c.codigo + " " + c.ruc + " " + c.vendedor).toLowerCase().includes(txt));

      <h3>Clientes activados · ${C.categoria === "TODAS" ? "todas las categorías" : C.categoria}${C.vendedor === "TODOS" ? "" : " · " + C.vendedor}</h3>

      <div class="buscador no-print">
        <input id="qCli" type="text" placeholder="Buscar por cliente, RIF, código o vendedor" value="${FILTRO_TXT.replace(/"/g,"&quot;")}">

        <button class="btn linea" id="bCsvTodo">Descargar CSV completo</button>

      <div class="tw" style="max-height:620px;overflow:auto">
        <table>
          <thead><tr><th>Cliente</th><th>RIF</th><th>Código</th><th>Vendedor</th><th>Supervisor</th><th>Monto</th><th>Kilos</th><th>Facturas</th><th>Última compra</th><th>Estado</th></tr></thead>
          <tbody>${filas.slice(0,400).map(c=>`<tr>
            <td><b>${c.nombre}</b></td><td>${c.ruc || "—"}</td><td>${c.codigo}</td><td>${c.vendedor}</td><td>${c.supervisor}</td>
            <td>${VJ.fu(c.monto)}</td><td>${f1(c.kilos)}</td><td>${f0(c.facturas)}</td><td>${c.ultima}</td>
            <td><span class="pill ${c.activado ? "ok" : "mal"}">${c.activado ? "activado" : "sin compra"}</span></td></tr>`).join("")}</tbody>
        </table>
      </div>
      ${filas.length > 400 ? `<p class="notas" style="margin-top:8px">Se muestran las primeras 400 filas de ${f0(filas.length)}; el CSV las trae todas.</p>` : ""}
    </div>`;
  }

  function csv(filas, cab){
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
    return "\ufeff" + [cab.join(";")].concat(filas.map(f => f.map(esc).join(";"))).join("\r\n");
  }

  function bajar(nombre, texto){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
    a.download = nombre; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }

  function csvVista(){
    const C = VJ.clientesDe(DS, { categoria: $("fCat").value, vendedor: $("fVend").value });
    const filas = C.lista.filter(c => SOLO_ACT ? c.activado : true).map(c =>
      [c.ruc, c.codigo, c.nombre, c.vendedor, c.supervisor, c.zona, C.categoria,
       c.monto.toFixed(2).replace(".", ","), c.kilos.toFixed(2).replace(".", ","), c.facturas, c.ultima, c.activado ? "ACTIVADO" : "SIN COMPRA"]);
    bajar(`clientes_activados_${C.categoria}_${C.vendedor}.csv`.replace(/\s+/g,"_"),
      csv(filas, ["RIF","Codigo","Cliente","Vendedor","Supervisor","Zona","Categoria","Monto","Kilos","Facturas","Ultima compra","Estado"]));
  }

  function csvTodo(){
    const cats = Object.keys(VJ.TARGETS);
    const filas = [];
    cats.forEach(cat => {
      const C = VJ.clientesDe(DS, { categoria: cat, vendedor: $("fVend").value });
      C.lista.filter(c => c.activado).forEach(c => filas.push(
        [cat, c.ruc, c.codigo, c.nombre, c.vendedor, c.supervisor, c.zona,
         c.monto.toFixed(2).replace(".", ","), c.kilos.toFixed(2).replace(".", ","), c.facturas, c.ultima]));
    });
    bajar("clientes_activados_todas_las_categorias.csv",
      csv(filas, ["Categoria","RIF","Codigo","Cliente","Vendedor","Supervisor","Zona","Monto","Kilos","Facturas","Ultima compra"]));
  }

  function pintarClientes(){
    $("clientes").innerHTML = tablaClientes();
    $("qCli").addEventListener("input", e => { FILTRO_TXT = e.target.value; const pos = e.target.selectionStart; pintarClientes(); const n = $("qCli"); n.focus(); n.setSelectionRange(pos, pos); });
    $("qAct").addEventListener("change", e => { SOLO_ACT = e.target.checked; pintarClientes(); });
    $("bCsv").addEventListener("click", csvVista);
    $("bCsvTodo").addEventListener("click", csvTodo);
  }

  function tablaRolling(){
    const cfg = VJ.leerLocal("vj_config") || {};
    const R = VJ.rolling(DS, { corte: cfg.corte });
    const celdas = v => `
      <td>${f1(v.cuota)}</td>
      <td>${f1(v.ventaDia)}</td>
      <td>${f1(v.venta)}</td>
      <td><span class="pill ${sem(v.cumpl)}">${v.cumpl == null ? "—" : fp(v.cumpl)}</span></td>
      <td>${f1(v.necesidad)}</td>
      <td>${f1(v.proyeccion)}</td>
      <td><span class="pill ${sem(v.cumplProy)}">${v.cumplProy == null ? "—" : fp(v.cumplProy)}</span></td>`;

    const filas = R.supervisores.map(S => `
      ${S.equipo.map(v => `<tr><td>${v.vendedor}</td>${celdas(v)}</tr>`).join("")}
      <tr class="grupo"><td>${S.supervisor}</td>${celdas(S)}</tr>`).join("");

    return `
    <div class="tarjeta kpi c3"><p class="rot">Tiempo transcurrido</p><p class="val">${fp(R.dias.tt)}</p>
      <div class="barrita"><span class="med" style="width:${R.dias.tt}%"></span></div>
      <p class="pie">${R.dias.transcurridos} de ${R.dias.habiles} días hábiles al ${R.dias.corte}<br><b>${R.dias.restantes}</b> días por facturar</p></div>
    <div class="tarjeta kpi rojo c3"><p class="rot">Kilos del mes vs cuota</p><p class="val">${f1(R.total.venta)}<small>kg</small></p>
      <div class="barrita"><span class="${sem(R.total.cumpl)}" style="width:${Math.min(100, R.total.cumpl||0)}%"></span></div>
      <p class="pie">Cuota <b>${f1(R.total.cuota)} kg</b> · cumplimiento <b>${fp(R.total.cumpl)}</b><br>Faltan <b>${f1(R.total.falta)} kg</b></p></div>
    <div class="tarjeta kpi ambar c3"><p class="rot">Necesidad diaria</p><p class="val">${f1(R.total.necesidad)}<small>kg/día</small></p>
      <p class="pie">Para cerrar la cuota en los ${R.dias.restantes} días hábiles restantes<br>Venta del día ${R.dias.corte}: <b>${f1(R.total.ventaDia)} kg</b></p></div>
    <div class="tarjeta kpi verde c3"><p class="rot">Proyección al cierre</p><p class="val">${f1(R.total.proyeccion)}<small>kg</small></p>
      <div class="barrita"><span class="${sem(R.total.cumplProy)}" style="width:${Math.min(100, R.total.cumplProy||0)}%"></span></div>
      <p class="pie">Cumplimiento proyectado <b>${fp(R.total.cumplProy)}</b><br>Al ritmo del ${fp(R.dias.tt)} de tiempo transcurrido</p></div>

    <div class="tarjeta c12">
      <h3>Rolling Nestlé en kilos por asesor</h3>
      <p class="sub">Corte ${R.dias.corte} · la proyección divide los kilos del mes entre el ${fp(R.dias.tt)} de tiempo transcurrido; la necesidad diaria reparte lo que falta entre los ${R.dias.restantes} días hábiles que quedan</p>
      <div class="tw"><table>
        <thead><tr><th>Vendedor</th><th>Cuota del mes (kg)</th><th>Venta diaria</th><th>Venta mes</th><th>% cumpl.</th><th>Necesidad diaria kg</th><th>Proyección kg</th><th>% cump. proyect.</th></tr></thead>
        <tbody>${filas}</tbody>
        <tfoot><tr class="granTotal"><td>TOTAL VENEJUGOS</td>${celdas(R.total)}</tr></tfoot>
      </table></div>
      <div class="buscador no-print" style="margin-top:12px;margin-bottom:0">
        <button class="btn azul" id="bCsvRoll">Descargar CSV del rolling</button>
      </div>
    </div>`;
  }

  function csvRolling(){
    const cfg = VJ.leerLocal("vj_config") || {};
    const R = VJ.rolling(DS, { corte: cfg.corte });
    const n = v => v.toFixed(1).replace(".", ",");
    const filas = [];
    R.supervisores.forEach(S => {
      S.equipo.forEach(v => filas.push(["ASESOR", v.supervisor, v.vendedor, n(v.cuota), n(v.ventaDia), n(v.venta),
        v.cumpl == null ? "" : n(v.cumpl), n(v.necesidad), n(v.proyeccion), v.cumplProy == null ? "" : n(v.cumplProy)]));
      filas.push(["SUPERVISOR", S.supervisor, "", n(S.cuota), n(S.ventaDia), n(S.venta),
        S.cumpl == null ? "" : n(S.cumpl), n(S.necesidad), n(S.proyeccion), S.cumplProy == null ? "" : n(S.cumplProy)]);
    });
    filas.push(["TOTAL", "VENEJUGOS", "", n(R.total.cuota), n(R.total.ventaDia), n(R.total.venta),
      n(R.total.cumpl), n(R.total.necesidad), n(R.total.proyeccion), n(R.total.cumplProy)]);
    bajar(`rolling_nestle_kilos_${R.dias.corte.replace(/\//g,"-")}.csv`,
      csv(filas, ["Nivel","Supervisor","Vendedor","Cuota kg","Venta diaria","Venta mes","% cumpl","Necesidad diaria kg","Proyeccion kg","% cump proyect"]));
  }

  function pintarRolling(){
    $("rolling").innerHTML = tablaRolling();
    $("bCsvRoll").addEventListener("click", csvRolling);
  }

  function tablaSemanal(){
    const cfg = VJ.leerLocal("vj_config") || {};
    const W = VJ.semanal(DS, { categoria: $("fCat").value, corte: cfg.corte });
    const cab = W.semanas.map(s => `<th>S${s.n}<br><small style="font-weight:600">${s.desde}–${s.hasta}</small></th>`).join("");

    const celda = (sm, valor, meta, deficit, fmt) => {
      if (!sm.transcurrida) return `<td class="sem fuera">—</td>`;
      const clase = deficit > 0 ? "mal" : "ok";
      return `<td class="sem"><span class="pill ${clase}">${deficit > 0 ? "−" + fmt(deficit) : "al día"}</span>
        <small>${fmt(valor)} de ${fmt(meta)}</small></td>`;
    };

    const bloque = (titulo, sub, campoVal, campoMeta, campoDef, fmt, totalFila) => `
      <div class="tarjeta c12">
        <h3>${titulo}</h3>
        <p class="sub">${sub}</p>
        <div class="tw"><table>
          <thead><tr><th>Vendedor</th><th>Supervisor</th>${cab}<th>Déficit acumulado</th></tr></thead>
          <tbody>${W.filas.map(v => `<tr>
            <td><b>${v.vendedor}</b></td><td>${v.supervisor}</td>
            ${v.semanas.map(sm => celda(sm, sm[campoVal], sm[campoMeta], sm[campoDef], fmt)).join("")}
            <td><span class="pill ${v[campoDef === "deficitKg" ? "incumpleKg" : "incumpleCli"] ? "mal" : "ok"}">${fmt(v[campoDef === "deficitKg" ? "deficitKg" : "deficitCli"])}</span></td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td>—</td>${W.semanas.map(() => "<td>—</td>").join("")}<td>${fmt(totalFila)}</td></tr></tfoot>
        </table></div>
      </div>`;

    const enDef = W.enDeficit;
    const aviso = `
      <div class="tarjeta aviso c12">
        <h3>Aviso de incumplimiento semanal</h3>
        <p class="sub">Corte ${W.corte} · semana ${W.semActual + 1} de ${W.total} · la cuota del mes se divide entre ${W.total} semanas</p>
        ${enDef.length === 0
          ? `<p class="notas">Ningún asesor arrastra déficit acumulado en esta semana.</p>`
          : `<p style="font-size:.86rem;margin:0 0 8px"><b>${enDef.length}</b> de ${W.filas.length} asesores están por debajo de la meta acumulada a la semana ${W.semActual + 1}.</p>
             <div>${enDef.map(v => `<span class="chip ${v.incumpleKg && v.incumpleCli ? "mal" : "med"}">${v.vendedor}: ${v.incumpleKg ? f1(v.deficitKg) + " kg" : ""}${v.incumpleKg && v.incumpleCli ? " · " : ""}${v.incumpleCli ? f0(v.deficitCli) + " clientes" : ""}</span>`).join("")}</div>`}
        <p class="notas" style="margin-top:12px">Déficit total acumulado: <b>${f1(W.totales.deficitKg)} kg</b> y <b>${f0(W.totales.deficitCli)} clientes</b> en ${W.categoria === "TODAS" ? "activación general" : W.categoria}.</p>
      </div>`;

    return aviso +
      bloque("Déficit semanal en kilos", `Cuota mensual repartida en ${W.total} semanas · cada celda muestra el déficit acumulado y, debajo, kilos reales contra meta acumulada`, "kilosAcum", "metaKgAcum", "deficitKg", f1, W.totales.deficitKg) +
      bloque(`Déficit semanal en cobertura · ${W.categoria === "TODAS" ? "todas las categorías" : W.categoria}`, `Meta de clientes activados repartida en ${W.total} semanas, target ${W.target}% sobre la cartera asignada`, "clientesAcum", "metaCliAcum", "deficitCli", f0, W.totales.deficitCli);
  }

  function pintarSemanal(){ $("semanal").innerHTML = tablaSemanal(); }

  function pintar(){
    const cfg = VJ.leerLocal("vj_config") || {};
    const M = VJ.computeVend(DS, { categoria: $("fCat").value, vendedor: $("fVend").value, corte: cfg.corte, baseNestle: cfg.baseNestle });
    const orden = $("fOrden").value;
    const sups = M.supervisores.slice().sort((a,b)=>
      orden === "faltan" ? b.faltan - a.faltan : orden === "cartera" ? b.cartera - a.cartera : (b.pct||0)-(a.pct||0));

    const mejor = M.supervisores[0];
    const peor = M.supervisores.slice().sort((a,b)=> b.faltan - a.faltan)[0];
    $("resumen").innerHTML = `
      <div class="tarjeta kpi c3"><p class="rot">${inverso() ? "Brecha pendiente del equipo" : "Activación del equipo comercial"}</p><p class="val">${fp(val(M.total))}</p>
        <div class="barrita"><span class="${sem(M.total.pct)}" style="width:${Math.min(100, val(M.total)||0)}%"></span></div>
        <p class="pie"><b>${f0(M.total.activados)}</b> activados de una meta de <b>${f0(M.total.meta)}</b><br>Base: ${f0(M.total.cartera)} clientes ${M.categoria === "TODAS" ? "de la base Nestlé" : (VJ.CONFITES.indexOf(M.categoria) > -1 ? "de Confites" : "de A&B")}${M.total.sinCartera ? " · " + f0(M.total.sinCartera) + " fuera de cartera" : ""}</p></div>
      <div class="tarjeta kpi rojo c3"><p class="rot">Clientes por activar</p><p class="val">${f0(M.total.faltan)}</p>
        <p class="pie">Para la meta de ${M.categoria === "TODAS" ? "activación general" : M.categoria} · target <b>${M.target}%</b><br>Ritmo necesario: <b>${f1(M.total.porDia)}</b> activaciones por día hábil</p></div>
      <div class="tarjeta kpi verde c3"><p class="rot">Mejor supervisor</p><p class="val" style="font-size:1.15rem">${mejor ? mejor.supervisor : "—"}</p>
        <p class="pie">${mejor ? `<b>${fp(mejor.pct)}</b> de cumplimiento · ${f0(mejor.activados)} de ${f0(mejor.meta)}` : ""}</p></div>
      <div class="tarjeta kpi ambar c3"><p class="rot">Mayor brecha por cubrir</p><p class="val" style="font-size:1.15rem">${peor ? peor.supervisor : "—"}</p>
        <p class="pie">${peor ? `Faltan <b>${f0(peor.faltan)}</b> clientes · ${fp(peor.pct)} de cumplimiento` : ""}</p></div>`;

    $("alertas").innerHTML = alertas(M);
    $("categorias").innerHTML = tablaCat(M);
    $("equipos").innerHTML = sups.map(tarjetaSup).join("");
    $("tabla").innerHTML = tablaVend(M);
    pintarClientes();
    pintarRolling();
    pintarSemanal();
    $("subtit").textContent = `Período ${M.meta.desde} al ${M.meta.hasta} · ${M.supervisores.length} supervisores · ${M.vendedores.length} vendedores`;
    $("selloMes").textContent = "Performance " + M.meta.mes;
    $("selloAct").textContent = "Actualizado " + (DS.publicado || DS.generado || "—");
    $("pieArchivo").textContent = `Fuente: ${M.meta.archivo} · procesado el ${DS.generado}${DS.publicado ? " · publicado el " + DS.publicado : ""} · corte ${M.dias.corte} · página abierta el ${new Date().toLocaleString("es-VE")}`;
  }

  async function cargar(primera){
    const r = await VJ.cargarDataset(DATASET_BASE);
    DS = r.ds;
    $("estado").innerHTML = `Origen: <b>${r.origen}</b>${r.error && r.origen !== "repositorio" ? " · no se pudo leer dataset.json (" + r.error + ")" : ""}`;
    $("selloArchivo").textContent = VJ.sello(DS, r.origen);

    if (primera) {
      const cats = Object.keys(VJ.TARGETS);
      $("fCat").innerHTML = `<option value="TODAS">Todas las categorías</option>` +
        cats.map(c => `<option value="${c}">${c} · target ${VJ.TARGETS[c]}%</option>`).join("");
      $("fCat").value = "CALDOS";
    }
    const conCartera = DS.vends.filter(v => VJ.CARTERAS[VJ.norm(v)] || VJ.norm(v) === "DIRECTO").sort();
    const sel = $("fVend").value;
    $("fVend").innerHTML = '<option>TODOS</option>' + conCartera.map(v=>`<option>${v}</option>`).join("");
    if (sel && conCartera.indexOf(sel) > -1) $("fVend").value = sel;
    pintar();
  }

  $("fCat").addEventListener("change", pintar);
  $("fOrden").addEventListener("change", pintar);
  $("fVend").addEventListener("change", pintar);
  $("fMedida").addEventListener("change", pintar);
  $("bPrint").addEventListener("click", ()=> window.print());
  document.querySelectorAll(".pest").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".pest").forEach(x => x.classList.remove("activa"));
    b.classList.add("activa");
    const v = b.dataset.vista;
    ["alertas","categorias","equipos","tabla"].forEach(id => $(id).style.display = v === "equipos" ? "grid" : "none");
    $("clientes").style.display = v === "clientes" ? "grid" : "none";
    $("rolling").style.display = v === "rolling" ? "grid" : "none";
    $("semanal").style.display = v === "semanal" ? "grid" : "none";
  }));
  $("bRecargar").addEventListener("click", async () => {
    $("bRecargar").disabled = true;
    $("bRecargar").textContent = "Recargando…";
    await cargar(false);
    $("bRecargar").textContent = "Recargar datos";
    $("bRecargar").disabled = false;
  });
  cargar(true);
})();
</script>
</body>
</html>
