<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLOBAL KPI · Performance vendedores por marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{
  --azul:#0B2A8A;        /* azul Venejugos profundo */
  --azul-med:#1740C4;
  --azul-claro:#E8EDFB;
  --rojo:#E5142B;
  --rojo-oscuro:#B00C1F;
  --blanco:#FFFFFF;
  --papel:#F4F6FC;
  --tinta:#10193A;
  --gris:#66708F;
  --linea:#D8DFF2;
  --verde:#128C5A;
  --ambar:#E08A00;
  --sombra:0 1px 2px rgba(11,42,138,.10), 0 8px 24px rgba(11,42,138,.07);
  --radio:14px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--papel); color:var(--tinta);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- Encabezado ---------- */
.barra{
  background:linear-gradient(105deg,var(--azul) 0%,var(--azul-med) 58%,#2C56E0 100%);
  color:#fff; position:relative; overflow:hidden;
}
.barra::after{
  content:""; position:absolute; right:-70px; top:-60px; width:260px; height:260px;
  background:var(--rojo); border-radius:50%; opacity:.9;
  clip-path:polygon(0 40%,100% 0,100% 100%,0 100%);
}
.barra-in{display:flex; gap:18px; align-items:center; padding:18px 26px; position:relative; z-index:2; flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;padding:5px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.logo-der{width:60px;height:60px;border-radius:0;flex:0 0 auto;margin-left:14px;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tit h1{font-size:1.5rem;letter-spacing:-.01em}
.tit p .panel{color:#fff;font-weight:800}
.tit h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tit p{margin:3px 0 0;font-size:.82rem;color:#C9D6FF;font-weight:500}
.sello{
  margin-left:auto;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 15px;font-size:.76rem;font-weight:700
}
.sello b{color:#fff}

/* ---------- Cinta de filtros ---------- */
.filtros{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--linea);padding:12px 26px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:150px}
.campo label{font-size:.68rem;font-weight:700;color:var(--gris);letter-spacing:.03em}
select,input[type=number],input[type=text],input[type=password],input[type=file]{
  font-family:inherit;font-size:.86rem;padding:8px 10px;border:1.5px solid var(--linea);
  border-radius:9px;background:#fff;color:var(--tinta);min-width:140px
}
select:focus,input:focus{outline:2px solid var(--azul-med);outline-offset:1px;border-color:var(--azul-med)}
.btn{
  font-family:inherit;font-size:.84rem;font-weight:700;padding:9px 18px;border-radius:9px;border:0;
  background:var(--rojo);color:#fff;cursor:pointer;transition:background .15s
}
.btn:hover{background:var(--rojo-oscuro)}
.btn.azul{background:var(--azul)} .btn.azul:hover{background:var(--azul-med)}
.btn.linea{background:#fff;color:var(--azul);border:1.5px solid var(--linea)}
.btn.linea:hover{background:var(--azul-claro)}
.btn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

/* ---------- Rejilla ---------- */
main{padding:20px 26px 48px;max-width:1500px;margin:0 auto}
.rej{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1080px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:620px){.c3{grid-column:span 12}}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px}
.tarjeta h3{margin:0 0 2px;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.tarjeta .sub{margin:0 0 12px;font-size:.74rem;color:var(--gris)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--azul)}
.kpi.rojo::before{background:var(--rojo)}
.kpi.verde::before{background:var(--verde)}
.kpi.ambar::before{background:var(--ambar)}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--gris);margin:0 0 6px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.kpi .val small{font-size:.9rem;font-weight:700;color:var(--gris);margin-left:4px}
.kpi .pie{margin:8px 0 0;font-size:.74rem;color:var(--gris);line-height:1.45}
.kpi .pie b{color:var(--tinta)}

.barrita{height:7px;background:var(--azul-claro);border-radius:99px;overflow:hidden;margin-top:10px}
.barrita span{display:block;height:100%;border-radius:99px;background:var(--azul-med)}
.barrita span.ok{background:var(--verde)} .barrita span.mal{background:var(--rojo)} .barrita span.med{background:var(--ambar)}

/* Tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{
  text-align:right;font-weight:700;color:#fff;background:var(--azul);
  padding:9px 10px;white-space:nowrap;position:sticky;top:0
}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFBFF}
tbody tr:hover{background:var(--azul-claro)}
tfoot td{font-weight:800;background:var(--azul-claro);border-top:2px solid var(--azul)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:800}
.pill.ok{background:#DCF3E9;color:var(--verde)}
.pill.med{background:#FDF0D8;color:var(--ambar)}
.pill.mal{background:#FBE0E3;color:var(--rojo-oscuro)}

.grafico{position:relative;height:300px}
.grafico.alto{height:380px}
.grafico.bajo{height:210px}

/* Resumen */
.resumen{background:linear-gradient(160deg,#fff 0%,#F7F9FF 100%);border-left:5px solid var(--rojo)}
.resumen p{font-size:.88rem;line-height:1.62;margin:0 0 12px;max-width:78ch;color:#1D2748}
.resumen p:last-child{margin-bottom:0}
.notas{font-size:.72rem;color:var(--gris);line-height:1.55}

dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:92%;box-shadow:0 30px 80px rgba(11,42,138,.35)}
dialog::backdrop{background:rgba(11,25,58,.55)}
dialog .cab{background:var(--azul);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
dialog .cab h3{margin:0;font-size:1rem}
dialog .cue{padding:20px 22px;max-height:65vh;overflow:auto}

.pie-doc{margin-top:26px;padding-top:14px;border-top:2px solid var(--linea);font-size:.72rem;color:var(--gris);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Impresión */
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  .filtros,.no-print{display:none!important}
  .barra{position:static}
  main{padding:0;max-width:none}
  .tarjeta{box-shadow:none;border:1px solid #C8D2EC;break-inside:avoid;page-break-inside:avoid}
  .rej{gap:9px}
  .grafico{height:230px}
  .salto{break-before:page;page-break-before:always}
}

.acceso{min-height:calc(100vh - 96px);display:grid;place-items:center;padding:28px}
.caja{width:100%;max-width:420px;background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra);padding:30px}
.caja img{width:76px;display:block;margin:0 auto 14px}
.caja h2{margin:0 0 4px;text-align:center;font-size:1.12rem}
.caja p.ay{margin:0 0 20px;text-align:center;font-size:.8rem;color:var(--gris)}
.caja input{width:100%;font-size:1rem;text-align:center;letter-spacing:.12em}
.caja .btn{width:100%;margin-top:14px;padding:12px}
.err{color:var(--rojo);font-size:.8rem;text-align:center;margin:10px 0 0;min-height:18px;font-weight:700}
.zona-carga{border:2px dashed var(--linea);border-radius:14px;padding:26px;text-align:center;background:#FAFBFF;transition:border-color .15s,background .15s}
.zona-carga.activa{border-color:var(--azul-med);background:var(--azul-claro)}
.zona-carga p{margin:6px 0 0;font-size:.8rem;color:var(--gris)}
.filaparam{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.log{font-size:.78rem;line-height:1.6;background:#0E1B3F;color:#C9D6FF;border-radius:10px;padding:14px;max-height:200px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.log b{color:#fff}
.ok-msg{background:#DCF3E9;color:var(--verde);border-radius:10px;padding:10px 14px;font-size:.82rem;font-weight:700}

.sup-cab{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.dona{flex:0 0 auto}
.dona text{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.sup-cab .nom{font-size:1.02rem;font-weight:800;margin:0;line-height:1.2}
.sup-cab .cifra{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.sup-cab .cifra small{font-size:.72rem;font-weight:700;color:var(--gris);display:block;letter-spacing:0}
.equipo{list-style:none;margin:0;padding:0}
.equipo li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:.84rem}
.equipo li+li{margin-top:4px}
.equipo li.bajo{background:#FDF1F3;border:1px solid #F6C9D0}
.equipo .punto{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.equipo .quien{flex:1;font-weight:700}
.equipo .par{font-family:Arial,Helvetica,sans-serif;color:var(--gris);white-space:nowrap}
.equipo .par b{color:var(--tinta)}
.equipo .tanto{font-weight:800;min-width:52px;text-align:right}
.t-ok{color:var(--verde)} .t-med{color:var(--ambar)} .t-mal{color:var(--rojo)}
.cintas{display:flex;height:9px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--azul-claro)}
.cintas span{display:block}
.aviso{border-left:5px solid var(--rojo);background:linear-gradient(160deg,#FFF5F6 0%,#fff 70%)}
.aviso h3{color:var(--rojo-oscuro)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:800;margin:3px 4px 0 0}
.chip.mal{background:#FBE0E3;color:var(--rojo-oscuro)}
.chip.med{background:#FDF0D8;color:var(--ambar)}
td.sem{min-width:84px}
td.sem small{display:block;font-size:.68rem;color:var(--gris);font-weight:600}
td.fuera{color:var(--gris)}
.pestanas{display:flex;gap:8px;border-bottom:2px solid var(--linea);padding-bottom:0}
.pest{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;border:0;background:transparent;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.pest:hover{color:var(--azul)}
.pest.activa{color:var(--azul);border-bottom-color:var(--rojo)}
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.buscador input{min-width:260px}
tr.grupo td{background:var(--azul-claro);font-weight:800;border-top:2px solid var(--azul)}
tr.granTotal td{background:var(--azul);color:#fff;font-weight:800}
tr.granTotal .pill{background:rgba(255,255,255,.18);color:#fff}
/* ---------- Macro: complementos ---------- */
.kpi.mini .val{font-size:1.45rem}
.chk{width:18px;height:18px;accent-color:var(--rojo);cursor:pointer}
td input[type=number],td input[type=text]{min-width:0;width:100%;max-width:120px;padding:5px 7px;font-size:.8rem;text-align:right}
td input[type=text]{text-align:left;max-width:180px}
tr.foco td:first-child{box-shadow:inset 4px 0 0 var(--rojo)}
.etq{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;background:#FBE0E3;color:var(--rojo-oscuro);margin-left:6px;vertical-align:middle}
.etq.azul{background:var(--azul-claro);color:var(--azul)}
.vacio{padding:18px;border:1.5px dashed var(--linea);border-radius:12px;color:var(--gris);font-size:.82rem;text-align:center;background:#FAFBFF}

th.izq,td.izq{text-align:left}
/* encabezado en una sola línea con el logo GLOBAL KPI fijo a la derecha */
@media (min-width:900px){
  .barra-in{flex-wrap:nowrap}
  .tit{flex:1 1 auto;min-width:0}
  .tit p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barra-in .sello,.barra-in .btn{flex:0 1 auto;min-width:0;white-space:nowrap}
  #selloArchivo{max-width:240px!important}
  .tit + .sello{margin-left:12px}
}
@media (min-width:900px){
  .barra-in .sello{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  .barra-in .btn{flex:0 0 auto}
}
@media (max-width:1280px){ #selloAct,#selloArchivo{display:none!important} }
@media (max-width:899px){ .logo-der{position:absolute;top:18px;right:18px;width:52px;height:52px;margin:0} }
@media (min-width:900px){
  .barra-in .sello{flex:0 0 auto}
  .barra-in #selloArchivo,.barra-in #selloAct{flex:0 1 auto;min-width:80px}
}
</style>
</head>
<body>

<script>/* ============================================================
   GLOBAL KPI · Motor de cálculo (todas las marcas) · Venejugos
   Réplica del modelo de cumplimiento Nestlé a escala de portafolio:
   la dimensión de evaluación es la marca (columna DescrMarca).
   ============================================================ */
const VJ = (function () {
  const VERSION = "macro-1";
  const PREFIJO = "vjm_";          /* llaves de almacenamiento propias del modelo macro */
  const TARGET_DEF = 25;           /* target de activación por defecto para marcas sin target */
  const FOCO_N = 5;                /* marcas foco por defecto: las de mayor venta */

  /* Estructura comercial vigente (heredada del modelo Nestlé): supervisor y cartera
     total asignada por asesor. Editable desde el panel administrativo. */
  const CARTERAS = {
    "SUGEI VEGA":         { ab: 92, conf: 81, tot: 121, sup: "SARA VELASQUEZ" },
    "MANUEL MONTILLA":    { ab: 69, conf: 108, tot: 139, sup: "SARA VELASQUEZ" },
    "JEFFERSON PRIETO":   { ab: 84, conf: 93, tot: 107, sup: "SARA VELASQUEZ" },
    "RICARDO GONZALEZ":   { ab: 71, conf: 74, tot: 86,  sup: "SARA VELASQUEZ" },
    "BETZI SANCHEZ":      { ab: 75, conf: 79, tot: 98,  sup: "RORAIMA SALAZAR" },
    "MAYLIN GUTIERREZ":   { ab: 74, conf: 71, tot: 99,  sup: "RORAIMA SALAZAR" },
    "ENLLYS NAVARRO":     { ab: 21, conf: 51, tot: 56,  sup: "RORAIMA SALAZAR" },
    "JEINNY NIETO":       { ab: 59, conf: 97, tot: 110, sup: "RORAIMA SALAZAR" },
    "DEYBER ALCANTARA":   { ab: 80, conf: 82, tot: 103, sup: "DANNY LA CRUZ" },
    "LUIS FRIAS":         { ab: 96, conf: 106, tot: 124, sup: "DANNY LA CRUZ" },
    "ZULEXIS MENDOZA":    { ab: 81, conf: 105, tot: 124, sup: "DANNY LA CRUZ" },
    "ALEXANDER BORGES":   { ab: 55, conf: 104, tot: 111, sup: "DANNY LA CRUZ" },
    "LISBETH FERRER":     { ab: 18, conf: 45, tot: 50,  sup: "RICARDO TEIXEIRA" },
    "MARY SUAREZ":        { ab: 14, conf: 43, tot: 55,  sup: "RICARDO TEIXEIRA" },
    "YEISON UMBRIA":      { ab: 52, conf: 48, tot: 54,  sup: "DIRECTO OFICINA" },
    "KEIBER BETANCOURT":  { ab: 65, conf: 65, tot: 93,  sup: "DIRECTO OFICINA" },
    "FRANCHESKA SANCHEZ": { ab: 8, conf: 20, tot: 20,  sup: "DIRECTO OFICINA" },
    "DIRECTO OFICINA":    { ab: 7, conf: 9, tot: 12,  sup: "DIRECTO OFICINA" },
    "VENEJUGOS EMPLEADOS":{ ab: 0, conf: 0, tot: 0,   sup: "DIRECTO OFICINA" }
  };
  const ALIAS_VEND = { "DIRECTO": "DIRECTO OFICINA" };
  const MAESTRO_DEF = Object.values(CARTERAS).reduce((a, c) => a + c.tot, 0);

  /* Tipo de documento (mismas reglas del modelo Nestlé) */
  const TIPO_DOC = { FACTURA: 0, NC_TESORERIA: 1, NC_LIGADA: 2 };
  const NC_ADMIN = /^(NCTESO|NCADM|NCTES|NCA)/;
  function tipoDocumento(doc, origen) {
    const d = String(doc == null ? "" : doc).toUpperCase().trim();
    if (!/^N[CD]/.test(d)) return TIPO_DOC.FACTURA;
    if (NC_ADMIN.test(d)) return TIPO_DOC.NC_TESORERIA;
    return String(origen || "").trim() ? TIPO_DOC.NC_LIGADA : TIPO_DOC.NC_TESORERIA;
  }

  function norm(s) {
    return String(s == null ? "" : s)
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toUpperCase().trim().replace(/\s+/g, " ");
  }

  function num(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return isFinite(v) ? v : 0;
    let s = String(v).trim().replace(/\s|\u00A0/g, "");
    const coma = s.lastIndexOf(","), punto = s.lastIndexOf(".");
    if (coma > -1 && punto > -1) {
      s = coma > punto ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    } else if (coma > -1) {
      s = (s.length - coma - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  const hay = v => v != null && v !== "" && !(typeof v === "number" && isNaN(v));

  function parseFecha(v) {
    if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
    const s = String(v).trim().split(" ")[0];
    let p = s.split(/[\/\-]/).map(Number);
    if (p.length < 3 || p.some(isNaN)) return null;
    if (p[0] > 31) return { y: p[0], m: p[1], d: p[2] };
    return { y: p[2], m: p[1], d: p[0] };
  }
  const pad = n => String(n).padStart(2, "0");
  const fechaTxt = f => `${pad(f.d)}/${pad(f.m)}/${f.y}`;

  /* Día hábil: lunes a viernes que no sea feriado (los feriados se cargan en el panel administrativo) */
  function esHabil(y, m, d, fer) {
    const w = new Date(y, m - 1, d).getDay();
    return w !== 0 && w !== 6 && !(fer && fer.has(fechaTxt({ y, m, d })));
  }
  function diasHabiles(y, m, fer) {
    const n = new Date(y, m, 0).getDate();
    let c = 0;
    for (let d = 1; d <= n; d++) if (esHabil(y, m, d, fer)) c++;
    return c;
  }
  function habilesHasta(y, m, d, fer) {
    let c = 0;
    for (let i = 1; i <= d; i++) if (esHabil(y, m, i, fer)) c++;
    return c;
  }
  const isoDe = txt => { const f = parseFecha(txt); return f ? `${f.y}-${pad(f.m)}-${pad(f.d)}` : ""; };
  const valorFecha = f => f.y * 1e4 + f.m * 100 + f.d;
  function corteDe(ds, corte) {
    const ult = parseFecha(ds.dias[ds.dias.length - 1]) || { y: ds.anio, m: ds.mesNum, d: 1 };
    const c = corte ? parseFecha(corte) : null;
    return (c && c.y === ds.anio && c.m === ds.mesNum) ? c : ult;
  }
  function tiempos(ds, corte, fer) {
    const c = corteDe(ds, corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, c.d, fer) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum, fer) || diasTrans;
    return { c, corte: fechaTxt(c), diasTrans, habiles, restantes: Math.max(1, habiles - diasTrans),
             factor: habiles / diasTrans, tt: diasTrans / habiles };
  }

  /* ---------- MAPEO TOLERANTE DE COLUMNAS ---------- */
  const llave = s => norm(s).replace(/[^A-Z0-9]/g, "");
  const CAMPOS = {
    marca: ["DescrMarca", "DescMarca", "Marca", "NombreMarca"],
    codMarca: ["CodMarca", "CodigoMarca"],
    sub: ["DescrSubCategoría", "DescrSubCategoria", "SubCategoría", "Subcategoria"],
    cat: ["DescrCategoría", "DescrCategoria", "Categoría", "Categoria"],
    fecha: ["FechaFactura", "Fecha"],
    cli: ["CódigoCliente", "CodigoCliente", "CodCliente", "RucCliente"],
    nom: ["RazónSocial", "RazonSocial", "NombreCliente", "Cliente"],
    ruc: ["RucCliente", "RUC", "RIF", "RifCliente"],
    zona: ["DescZona", "Zona", "DescrZona"],
    vend: ["NombreVend", "Vendedor", "NombreVendedor"],
    sup: ["NombSuperv", "NombreSuperv", "Supervisor"],
    kilos: ["Kilos", "PesoNeto", "Peso Neto"],
    venta: ["PrecioTotal", "Precio Total", "Total con IVA"],
    cant: ["Cantidad", "CantidadEnUnidadInventario"],
    doc: ["NúmeroFactura", "NumeroFactura", "Documento", "NroDocumento"],
    docOrigen: ["FacturaOrigen", "DocumentoOrigen", "NúmeroFacturaOrigen", "NumeroFacturaOrigen", "DocOrigen"]
  };
  const OPCIONALES = ["codMarca", "docOrigen", "ruc", "sup", "cant"];
  function mapaColumnas(filas) {
    const claves = filas.length ? Object.keys(filas[0]) : [];
    const M = {};
    Object.entries(CAMPOS).forEach(([k, alts]) => {
      let hallado = null;
      for (const a of alts) { hallado = claves.find(c => llave(c) === llave(a)); if (hallado) break; }
      M[k] = hallado || null;
    });
    M.faltantes = Object.keys(CAMPOS).filter(k => !M[k] && OPCIONALES.indexOf(k) < 0);
    return M;
  }

  function repararHoja(ws) {
    let maxR = 0, maxC = 0;
    Object.keys(ws).forEach(k => {
      if (k[0] === "!") return;
      const c = XLSX.utils.decode_cell(k);
      if (c.r > maxR) maxR = c.r;
      if (c.c > maxC) maxC = c.c;
    });
    ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    return { filas: maxR + 1, columnas: maxC + 1 };
  }

  /* ---------- EMPAQUETADO: filas del Excel -> dataset compacto ----------
     Fila: [cliente, zona, vendedor, MARCA, día, kilos, venta, unidades, tipoDoc, subcategoría, categoría] */
  function pack(filas, nombreArchivo) {
    const K = mapaColumnas(filas);
    const V = (f, k, def) => (K[k] && hay(f[K[k]])) ? f[K[k]] : def;
    const dims = ["marcas", "subs", "cats", "clientes", "zonas", "vends", "supers", "dias"];
    const D = {}, I = {};
    dims.forEach(k => { D[k] = []; I[k] = new Map(); });
    const idx = (k, val) => { if (!I[k].has(val)) { I[k].set(val, D[k].length); D[k].push(val); } return I[k].get(val); };
    const clientesNom = [], clientesRuc = [], supDeVend = [];

    /* el mes evaluado es el de la fecha más reciente del archivo */
    let ultima = null;
    filas.forEach(f => {
      const fe = parseFecha(V(f, "fecha", ""));
      if (fe && (!ultima || fe.y * 1e4 + fe.m * 100 + fe.d > ultima.y * 1e4 + ultima.m * 100 + ultima.d)) ultima = fe;
    });

    const r = [];
    let vacias = 0, fueraMes = 0, sinMarca = 0;
    filas.forEach(f => {
      const cli = String(V(f, "cli", "")).trim();
      const kg = num(V(f, "kilos", 0)), us = num(V(f, "venta", 0));
      const marcaTxt = norm(V(f, "marca", "")) || norm(V(f, "codMarca", ""));
      if (!cli && !marcaTxt && !kg && !us) { vacias++; return; }
      const fe = parseFecha(V(f, "fecha", ""));
      if (fe && ultima && (fe.y !== ultima.y || fe.m !== ultima.m)) { fueraMes++; return; }
      if (!marcaTxt) sinMarca++;

      const cIdx = idx("clientes", cli || "SIN CLIENTE");
      if (!clientesNom[cIdx]) clientesNom[cIdx] = String(V(f, "nom", "")).trim();
      if (!clientesRuc[cIdx]) clientesRuc[cIdx] = String(V(f, "ruc", "")).trim();
      const vIdx = idx("vends", String(V(f, "vend", "SIN VENDEDOR")).trim() || "SIN VENDEDOR");
      const sIdx = idx("supers", norm(V(f, "sup", "SIN SUPERVISOR")) || "SIN SUPERVISOR");
      if (supDeVend[vIdx] == null) supDeVend[vIdx] = sIdx;
      r.push([
        cIdx,
        idx("zonas", String(V(f, "zona", "SIN ZONA")).trim() || "SIN ZONA"),
        vIdx,
        idx("marcas", marcaTxt || "SIN MARCA"),
        idx("dias", fe ? fechaTxt(fe) : "s/f"),
        Math.round(kg * 1000) / 1000,
        Math.round(us * 100) / 100,
        Math.round(num(V(f, "cant", 0))),
        tipoDocumento(V(f, "doc", ""), V(f, "docOrigen", "")),
        idx("subs", norm(V(f, "sub", "")) || "SIN SUBCATEGORIA"),
        idx("cats", norm(V(f, "cat", "")) || "SIN CATEGORIA")
      ]);
    });

    /* días en orden cronológico */
    const orden = D.dias.map((d, i) => ({ d, i })).sort((a, b) => {
      const A = a.d.split("/"), B = b.d.split("/");
      return (A[2] + A[1] + A[0]).localeCompare(B[2] + B[1] + B[0]);
    });
    const remap = {}; orden.forEach((o, k) => remap[o.i] = k);
    r.forEach(row => row[4] = remap[row[4]]);

    const y = ultima ? ultima.y : new Date().getFullYear(), m = ultima ? ultima.m : new Date().getMonth() + 1;
    return {
      version: VERSION, archivo: nombreArchivo || "archivo.xlsx",
      generado: new Date().toLocaleString("es-VE"), ts: Date.now(),
      mes: `${pad(m)}/${y}`, anio: y, mesNum: m, columnas: K,
      descartadas: { vacias, fueraMes, sinMarca },
      marcas: D.marcas, subs: D.subs, cats: D.cats,
      clientes: D.clientes, clientesNom, clientesRuc, zonas: D.zonas, vends: D.vends,
      supers: D.supers, supDeVend, dias: orden.map(o => o.d), r
    };
  }

  /* ---------- PARÁMETROS ----------
     cfg = { ts, universo, targetDef, medida: "usd"|"kg", corte, foco: [marcas],
             marcas: { MARCA: { target, cuotaUsd, cuotaKg } },
             vends:  { VENDEDOR: { sup, cartera, cuotaUsd, cuotaKg } } } */
  function ranking(ds) {
    const venta = new Map();
    ds.r.forEach(x => { if ((x[8] || 0) !== TIPO_DOC.NC_TESORERIA) venta.set(x[3], (venta.get(x[3]) || 0) + x[6]); });
    return ds.marcas.map((n, i) => ({ n, v: venta.get(i) || 0 })).sort((a, b) => b.v - a.v || a.n.localeCompare(b.n)).map(o => o.n);
  }
  const claveVend = n => ALIAS_VEND[norm(n)] || norm(n);

  function params(ds, cfg) {
    cfg = cfg || {};
    const rk = ranking(ds);
    const targetDef = hay(cfg.targetDef) ? num(cfg.targetDef) : TARGET_DEF;
    const foco = Array.isArray(cfg.foco) && cfg.foco.length ? cfg.foco.slice() : rk.slice(0, FOCO_N);
    const CM = cfg.marcas || {}, CV = cfg.vends || {};
    const marca = n => {
      const c = CM[n] || {};
      return { target: hay(c.target) ? num(c.target) : targetDef, propio: hay(c.target),
               cuotaUsd: num(c.cuotaUsd), cuotaKg: num(c.cuotaKg) };
    };
    const vend = (n, iV) => {
      const k = claveVend(n), c = CV[k] || {}, base = CARTERAS[k];
      const supArchivo = (iV != null && ds.supDeVend && ds.supDeVend[iV] != null) ? ds.supers[ds.supDeVend[iV]] : null;
      return {
        clave: k,
        sup: norm(c.sup) || (base && base.sup) || supArchivo || "SIN SUPERVISOR",
        cartera: hay(c.cartera) ? num(c.cartera) : (base ? base.tot : null),
        cuotaUsd: num(c.cuotaUsd), cuotaKg: num(c.cuotaKg),
        enEstructura: !!(base || CV[k])
      };
    };
    const feriados = (Array.isArray(cfg.feriados) ? cfg.feriados : String(cfg.feriados || "").split(/[,;\s]+/))
      .map(t => parseFecha(t)).filter(Boolean).map(fechaTxt);
    return {
      targetDef, foco, ranking: rk, marca, vend, feriados, fer: new Set(feriados),
      universo: num(cfg.universo) > 0 ? num(cfg.universo) : MAESTRO_DEF,
      medida: cfg.medida === "kg" ? "kg" : "usd", corte: cfg.corte || ""
    };
  }

  /* ---------- FORMATOS ---------- */
  const f0 = n => (n == null || isNaN(n)) ? "—" : Math.round(n).toLocaleString("es-VE");
  const f1 = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("es-VE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fp = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("es-VE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  const fu = n => {
    if (n == null || isNaN(n)) return "—";
    const d = Math.abs(n) < 1000 ? 2 : 0;
    return (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("es-VE", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const MEDIDAS = {
    usd: { i: 6, u: "US$", cuota: "cuotaUsd", nombre: "venta en US$", fmt: fu, fmtCorto: fu },
    kg:  { i: 5, u: "kg",  cuota: "cuotaKg",  nombre: "kilos", fmt: n => f1(n) + " kg", fmtCorto: f1 }
  };
  const medidaDe = m => MEDIDAS[m === "kg" ? "kg" : "usd"];

  /* ---------- CÁLCULO DEL TABLERO MACRO ---------- */
  function compute(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const med = medidaDe(opt.medida || P.medida);
    const zF = opt.zona && opt.zona !== "TODAS" ? ds.zonas.indexOf(opt.zona) : -1;
    const vF = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const kF = opt.categoria && opt.categoria !== "TODAS" ? ds.cats.indexOf(opt.categoria) : -1;
    const rows = ds.r.filter(x => (zF < 0 || x[1] === zF) && (vF < 0 || x[2] === vF) && (kF < 0 || x[10] === kF))
      .filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);

    /* universo de activación: maestro general, cartera del vendedor o clientes de la zona */
    let universo, origenUniverso;
    if (vF >= 0) {
      const pv = P.vend(ds.vends[vF], vF);
      universo = pv.cartera || new Set(rows.map(x => x[0])).size; origenUniverso = "cartera del vendedor";
    } else if (zF >= 0) {
      universo = new Set(ds.r.filter(x => x[1] === zF).map(x => x[0])).size; origenUniverso = "clientes atendidos en la zona";
    } else { universo = P.universo; origenUniverso = "maestro de clientes"; }

    const T = tiempos(ds, opt.corte != null ? opt.corte : P.corte, P.fer);
    const factor = T.factor;
    const acumula = () => ({ kilos: 0, venta: 0, unid: 0, cli: new Set() });
    const glob = acumula();
    const porMarca = new Map(), porCat = new Map(), porZona = new Map(), porVend = new Map(), porCli = new Map();
    const focoIdx = new Set(P.foco.map(n => ds.marcas.indexOf(n)).filter(i => i >= 0));
    const serie = ds.dias.map(d => ({ fecha: d.slice(0, 5), vol: 0, volFoco: 0, cli: new Set() }));

    const suma = (map, key, kg, us, un, c, activa) => {
      if (!map.has(key)) map.set(key, acumula());
      const A = map.get(key); A.kilos += kg; A.venta += us; A.unid += un; if (activa) A.cli.add(c);
      return A;
    };
    rows.forEach(x => {
      const [c, z, v, m, d, kg, us, un] = x;
      const activa = (x[8] || 0) === TIPO_DOC.FACTURA && us > 0;
      const vol = x[med.i];
      glob.kilos += kg; glob.venta += us; glob.unid += un; if (activa) glob.cli.add(c);
      suma(porMarca, m, kg, us, un, c, activa);
      suma(porCat, x[10], kg, us, un, c, activa);
      suma(porZona, z, kg, us, un, c, activa);
      suma(porVend, v, kg, us, un, c, activa);
      const C = suma(porCli, c, kg, us, un, c, activa);
      if (activa) (C.marcas = C.marcas || new Set()).add(m);
      serie[d].vol += vol; if (focoIdx.has(m)) serie[d].volFoco += vol; if (activa) serie[d].cli.add(c);
    });
    const volDe = A => med.i === 6 ? A.venta : A.kilos;
    const totalVenta = glob.venta;

    const fila = nombre => {
      const i = ds.marcas.indexOf(nombre);
      const S = porMarca.get(i) || acumula();
      const pm = P.marca(nombre);
      const act = S.cli.size, pct = universo ? 100 * act / universo : 0;
      const req = Math.ceil(universo * pm.target / 100);
      const vol = volDe(S), cuota = pm[med.cuota];
      return {
        marca: nombre, foco: P.foco.indexOf(nombre) > -1,
        activados: act, universo, pct, target: pm.target, targetPropio: pm.propio,
        requeridos: req, faltan: Math.max(0, req - act),
        cumpl: pm.target ? 100 * pct / pm.target : 100,
        vol, volProy: vol * factor, cuota,
        cumplVol: cuota ? 100 * vol / cuota : null,
        cumplVolProy: cuota ? 100 * vol * factor / cuota : null,
        faltanteVol: cuota ? Math.max(0, cuota - vol) : null,
        faltanteVolProy: cuota ? cuota - vol * factor : null,
        kilos: S.kilos, venta: S.venta, unid: S.unid,
        share: totalVenta ? 100 * S.venta / totalVenta : 0
      };
    };

    const foco = P.foco.map(fila);
    let acum = 0;
    const todas = Array.from(porMarca.keys()).map(i => fila(ds.marcas[i]))
      .sort((a, b) => b.venta - a.venta || a.marca.localeCompare(b.marca))
      .map(r => { acum += r.share; r.shareAcum = acum; return r; });

    const lista = (map, nombres, key) => Array.from(map.entries())
      .map(([k, A]) => ({ [key]: nombres[k], vol: volDe(A), kilos: A.kilos, venta: A.venta, clientes: A.cli.size,
                          share: totalVenta ? 100 * A.venta / totalVenta : 0 }))
      .sort((a, b) => b.vol - a.vol);

    let ac = 0, acF = 0;
    const serieOut = serie.map(s => { ac += s.vol; acF += s.volFoco; return { fecha: s.fecha, vol: s.vol, volFoco: s.volFoco, volAcum: ac, volFocoAcum: acF, clientes: s.cli.size }; });

    const activados = glob.cli.size;
    const vol = volDe(glob);
    const volFoco = foco.reduce((a, r) => a + r.vol, 0);
    const cuotaFoco = foco.reduce((a, r) => a + (r.cuota || 0), 0);
    const cuotaTotal = ds.marcas.reduce((a, n) => a + P.marca(n)[med.cuota], 0);
    const clientesAct = Array.from(porCli.values()).filter(C => C.marcas && C.marcas.size);
    const profundidad = clientesAct.length ? clientesAct.reduce((a, C) => a + C.marcas.size, 0) / clientesAct.length : 0;
    const n80 = (todas.findIndex(r => r.shareAcum >= 80) + 1) || todas.length;
    const top5 = todas.slice(0, 5).reduce((a, r) => a + r.share, 0);
    const conTarget = todas.filter(t => t.target > 0);

    return {
      medida: med, medidaClave: med.i === 6 ? "usd" : "kg",
      meta: {
        archivo: ds.archivo, generado: ds.generado, mes: ds.mes,
        desde: ds.dias[0], hasta: ds.dias[ds.dias.length - 1],
        diasTrans: T.diasTrans, habiles: T.habiles, restantes: T.restantes, factor, corte: T.corte,
        registros: rows.length, zona: opt.zona || "TODAS", vendedor: opt.vendedor || "TODOS",
        categoria: opt.categoria || "TODAS", origenUniverso, focoAuto: !(cfg && Array.isArray(cfg.foco) && cfg.foco.length)
      },
      glob: {
        universo, activados, noActivados: Math.max(0, universo - activados),
        pctAct: universo ? 100 * activados / universo : 0,
        vol, volProy: vol * factor, volFoco, volFocoProy: volFoco * factor,
        kilos: glob.kilos, venta: glob.venta, unid: glob.unid,
        cuotaFoco, cuotaTotal,
        cumplFocoVol: cuotaFoco ? 100 * volFoco / cuotaFoco : null,
        cumplFocoVolProy: cuotaFoco ? 100 * volFoco * factor / cuotaFoco : null,
        faltanteFoco: Math.max(0, cuotaFoco - volFoco), faltanteFocoProy: cuotaFoco - volFoco * factor,
        cumplTotal: cuotaTotal ? 100 * vol / cuotaTotal : null,
        cumplTotalProy: cuotaTotal ? 100 * vol * factor / cuotaTotal : null,
        faltanteTotal: Math.max(0, cuotaTotal - vol), faltanteTotalProy: cuotaTotal - vol * factor,
        cumplFoco: foco.length ? foco.reduce((a, t) => a + Math.min(100, t.cumpl || 0), 0) / foco.length : 0,
        cumplPond: conTarget.length ? conTarget.reduce((a, t) => a + Math.min(100, t.cumpl), 0) / conTarget.length : 0,
        marcasActivas: todas.filter(t => t.venta > 0).length, marcasTotal: ds.marcas.length,
        profundidad, ventaCliente: activados ? glob.venta / activados : 0,
        n80, top5, focoShare: foco.reduce((a, r) => a + r.share, 0)
      },
      foco, todas, serie: serieOut,
      categorias: lista(porCat, ds.cats, "categoria"),
      zonas: lista(porZona, ds.zonas, "zona"),
      vendedores: lista(porVend, ds.vends, "vendedor"),
      clientes: lista(porCli, ds.clientes, "cliente").slice(0, 15),
      listaZonas: ds.zonas.slice().sort(), listaVends: ds.vends.slice().sort(), listaCats: ds.cats.slice().sort()
    };
  }

  /* ---------- PERFORMANCE POR VENDEDOR Y SUPERVISOR ---------- */
  function computeVend(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const med = medidaDe(opt.medida || P.medida);
    const mk = opt.marca && opt.marca !== "TODAS" ? opt.marca : "TODAS";
    const mi = mk === "TODAS" ? -1 : ds.marcas.indexOf(mk);
    const tgt = mk === "TODAS" ? 100 : P.marca(mk).target;
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const filas = (vFil < 0 ? ds.r : ds.r.filter(x => x[2] === vFil)).filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);
    const T = tiempos(ds, opt.corte != null ? opt.corte : P.corte, P.fer);
    const porDia = faltan => faltan / T.restantes;

    const atendidos = {}, activos = {}, volV = {};
    filas.forEach(x => {
      const [c, , v, m] = x;
      (atendidos[v] = atendidos[v] || new Set()).add(c);
      if (mi < 0 || m === mi) {
        volV[v] = (volV[v] || 0) + x[med.i];
        if ((x[8] || 0) === TIPO_DOC.FACTURA && x[6] > 0) (activos[v] = activos[v] || new Set()).add(c);
      }
    });

    const vendedores = ds.vends.map((nom, i) => {
      if (vFil >= 0 && i !== vFil) return null;
      const pv = P.vend(nom, i);
      const atendida = atendidos[i] ? atendidos[i].size : 0;
      const base = pv.cartera != null ? pv.cartera : atendida;
      const act = activos[i] ? activos[i].size : 0;
      const meta = Math.round(base * tgt / 100);
      const faltan = Math.max(0, meta - act);
      return {
        vendedor: nom, supervisor: pv.sup, enEstructura: pv.enEstructura, atendida,
        cartera: base, meta, activados: act, faltan, vol: volV[i] || 0,
        pctAct: base ? 100 * act / base : null,
        pendienteAct: base ? 100 * faltan / base : null,
        pct: meta ? 100 * act / meta : null,
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : null,
        porDia: porDia(faltan)
      };
    }).filter(v => v && (v.cartera > 0 || v.atendida > 0));

    const mapa = new Map();
    vendedores.forEach(v => {
      if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, { supervisor: v.supervisor, cartera: 0, meta: 0, activados: 0, vol: 0, equipo: [] });
      const S = mapa.get(v.supervisor);
      S.cartera += v.cartera; S.meta += v.meta; S.activados += v.activados; S.vol += v.vol; S.equipo.push(v);
    });
    const supervisores = Array.from(mapa.values()).map(S => {
      S.equipo.sort((a, b) => (b.pct || 0) - (a.pct || 0));
      S.pct = S.meta ? 100 * S.activados / S.meta : null;
      S.pendiente = S.pct == null ? null : Math.max(0, 100 - S.pct);
      S.faltan = S.equipo.reduce((a, v) => a + v.faltan, 0);
      S.pctAct = S.cartera ? 100 * S.activados / S.cartera : null;
      S.pendienteAct = S.cartera ? 100 * S.faltan / S.cartera : null;
      S.porDia = porDia(S.faltan);
      return S;
    }).sort((a, b) => (b.pct || 0) - (a.pct || 0));

    const tot = vendedores.reduce((a, v) => ({ cartera: a.cartera + v.cartera, meta: a.meta + v.meta, activados: a.activados + v.activados, vol: a.vol + v.vol }), { cartera: 0, meta: 0, activados: 0, vol: 0 });
    tot.sinCartera = 0;
    if (mk === "TODAS" && vFil < 0 && P.universo > tot.cartera) {
      tot.sinCartera = P.universo - tot.cartera;
      tot.cartera = P.universo;
      tot.meta = Math.round(P.universo * tgt / 100);
    }
    tot.pct = tot.meta ? 100 * tot.activados / tot.meta : null;
    tot.pendiente = tot.pct == null ? null : Math.max(0, 100 - tot.pct);
    tot.faltan = vendedores.reduce((a, v) => a + v.faltan, 0) + tot.sinCartera;
    tot.pctAct = tot.cartera ? 100 * tot.activados / tot.cartera : null;
    tot.pendienteAct = tot.cartera ? 100 * tot.faltan / tot.cartera : null;
    tot.porDia = porDia(tot.faltan);

    /* por marca, para el alcance filtrado */
    const baseAlcance = vendedores.reduce((a, v) => a + v.cartera, 0) || new Set(filas.map(x => x[0])).size;
    const actM = {}, volM = {};
    filas.forEach(x => {
      volM[x[3]] = (volM[x[3]] || 0) + x[med.i];
      if (x[6] > 0 && (x[8] || 0) === TIPO_DOC.FACTURA) (actM[x[3]] = actM[x[3]] || new Set()).add(x[0]);
    });
    const porMarca = P.ranking.map(n => {
      const i = ds.marcas.indexOf(n), target = P.marca(n).target;
      const act = actM[i] ? actM[i].size : 0;
      const meta = Math.round(baseAlcance * target / 100);
      const faltan = Math.max(0, meta - act);
      return {
        marca: n, foco: P.foco.indexOf(n) > -1, target, cartera: baseAlcance, meta, activados: act, faltan, vol: volM[i] || 0,
        pctCartera: baseAlcance ? 100 * act / baseAlcance : 0,
        pct: meta ? 100 * act / meta : (target === 0 ? 100 : null),
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : 0,
        porDia: porDia(faltan)
      };
    });

    return {
      medida: med, marca: mk, target: tgt, vendedor: opt.vendedor || "TODOS",
      supervisores, vendedores, porMarca, total: tot,
      bases: { universo: P.universo, alcance: baseAlcance, carteras: vendedores.reduce((a, v) => a + v.cartera, 0) },
      dias: { transcurridos: T.diasTrans, habiles: T.habiles, restantes: T.restantes, corte: T.corte },
      meta: { archivo: ds.archivo, desde: ds.dias[0], hasta: ds.dias[ds.dias.length - 1], mes: ds.mes }
    };
  }

  /* ---------- CLIENTES ACTIVADOS ---------- */
  function clientesDe(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const mk = opt.marca && opt.marca !== "TODAS" ? opt.marca : "TODAS";
    const mi = mk === "TODAS" ? -1 : ds.marcas.indexOf(mk);
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const filas = (vFil < 0 ? ds.r : ds.r.filter(x => x[2] === vFil)).filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);

    const mapa = new Map();
    filas.forEach(x => {
      const [c, z, v, m, d, kg, us] = x;
      if (!mapa.has(c)) mapa.set(c, {
        codigo: ds.clientes[c], nombre: (ds.clientesNom || [])[c] || ds.clientes[c],
        ruc: (ds.clientesRuc || [])[c] || "", vendedor: ds.vends[v], zona: ds.zonas[z],
        supervisor: P.vend(ds.vends[v], v).sup,
        monto: 0, kilos: 0, montoTotal: 0, dia: -1, facturas: 0, conFactura: false, marcas: new Set()
      });
      const C = mapa.get(c);
      C.montoTotal += us;
      if ((x[8] || 0) === TIPO_DOC.FACTURA && us > 0) C.marcas.add(m);
      if (mi < 0 || m === mi) {
        C.monto += us; C.kilos += kg;
        if ((x[8] || 0) === TIPO_DOC.FACTURA) {
          C.facturas++;
          if (us > 0) C.conFactura = true;
          if (d > C.dia) C.dia = d;
        }
      }
    });
    const lista = Array.from(mapa.values()).map(C => {
      C.activado = C.conFactura;
      C.ultima = C.dia >= 0 ? ds.dias[C.dia] : "—";
      C.nMarcas = C.marcas.size;
      return C;
    }).sort((a, b) => b.monto - a.monto || a.nombre.localeCompare(b.nombre));
    return {
      marca: mk, vendedor: opt.vendedor || "TODOS", lista,
      activados: lista.filter(c => c.activado).length, atendidos: lista.length,
      kilos: lista.reduce((a, c) => a + c.kilos, 0), monto: lista.reduce((a, c) => a + c.monto, 0)
    };
  }

  /* ---------- ROLLING DE VOLUMEN: por asesor y por marca ---------- */
  function rolling(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const med = medidaDe(opt.medida || P.medida);
    const T = tiempos(ds, opt.corte != null ? opt.corte : P.corte, P.fer);
    const diaCorte = ds.dias.indexOf(T.corte);
    const mesV = {}, diaV = {}, mesM = {}, diaM = {};
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA) return;
      const v = x[med.i];
      mesV[x[2]] = (mesV[x[2]] || 0) + v; mesM[x[3]] = (mesM[x[3]] || 0) + v;
      if (x[4] === diaCorte) { diaV[x[2]] = (diaV[x[2]] || 0) + v; diaM[x[3]] = (diaM[x[3]] || 0) + v; }
    });
    const linea = (cuota, venta, ventaDia) => {
      const proy = venta / T.tt, falta = Math.max(0, cuota - venta);
      return { cuota, ventaDia, venta, falta, proyeccion: proy,
               cumpl: cuota ? 100 * venta / cuota : null,
               necesidad: cuota ? falta / T.restantes : 0,
               cumplProy: cuota ? 100 * proy / cuota : null };
    };
    const suma = arr => {
      const S = arr.reduce((a, v) => ({ cuota: a.cuota + v.cuota, ventaDia: a.ventaDia + v.ventaDia, venta: a.venta + v.venta,
        necesidad: a.necesidad + v.necesidad, proyeccion: a.proyeccion + v.proyeccion, falta: a.falta + v.falta }),
        { cuota: 0, ventaDia: 0, venta: 0, necesidad: 0, proyeccion: 0, falta: 0 });
      S.cumpl = S.cuota ? 100 * S.venta / S.cuota : null;
      S.cumplProy = S.cuota ? 100 * S.proyeccion / S.cuota : null;
      return S;
    };

    const vendedores = ds.vends.map((nom, i) => {
      const pv = P.vend(nom, i), cuota = pv[med.cuota];
      if (!mesV[i] && !cuota) return null;
      return Object.assign({ vendedor: nom, supervisor: pv.sup }, linea(cuota, mesV[i] || 0, diaV[i] || 0));
    }).filter(Boolean);
    const mapa = new Map();
    vendedores.forEach(v => { if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, []); mapa.get(v.supervisor).push(v); });
    const supervisores = Array.from(mapa.entries()).map(([sup, equipo]) =>
      Object.assign(suma(equipo), { supervisor: sup, equipo: equipo.sort((a, b) => b.venta - a.venta) }))
      .sort((a, b) => b.venta - a.venta);

    const marcas = P.ranking.map(n => {
      const i = ds.marcas.indexOf(n), cuota = P.marca(n)[med.cuota];
      return Object.assign({ marca: n, foco: P.foco.indexOf(n) > -1 }, linea(cuota, mesM[i] || 0, diaM[i] || 0));
    });

    return {
      medida: med, vendedores, supervisores, total: suma(vendedores), marcas, totalMarcas: suma(marcas),
      sinCuotaVend: vendedores.every(v => !v.cuota), sinCuotaMarca: marcas.every(m => !m.cuota),
      dias: { transcurridos: T.diasTrans, habiles: T.habiles, restantes: T.restantes, tt: 100 * T.tt, corte: T.corte }
    };
  }

  /* ---------- AVANCE SEMANAL Y DÉFICIT PROGRESIVO ----------
     1. Semana = bloque de lunes a viernes dentro del mes, sin feriados. La primera y la
        última semana suelen quedar cortas (en octubre 2026 la semana 1 tiene solo 2 días).
     2. La cuota del mes se reparte por DÍA HÁBIL: cada semana recibe
        cuota x (días hábiles de la semana / días hábiles del mes). Una semana de 2 días
        carga 2/22 de la cuota, no 1/5.
     3. Meta acumulada al cierre de un día = cuota x días hábiles transcurridos / días hábiles del mes.
        En la semana en curso se exige solo lo que corresponde a los días ya vividos.
     4. Déficit = meta acumulada − real acumulado, solo con la data facturada hasta ese día. */
  function semanasDelMes(y, m, fer) {
    const n = new Date(y, m, 0).getDate();
    const sem = []; let actual = null, antes = 0;
    for (let d = 1; d <= n; d++) {
      const w = new Date(y, m - 1, d).getDay();
      if (w === 0 || w === 6) continue;
      if (!actual || w === 1) { actual = { n: sem.length + 1, desde: d, hasta: d, dias: 0, habAntes: antes, feriados: 0 }; sem.push(actual); }
      actual.hasta = d;
      if (esHabil(y, m, d, fer)) { actual.dias++; antes++; } else actual.feriados++;
    }
    return sem.filter(s => s.dias > 0).map((s, i) => Object.assign(s, { n: i + 1 }));
  }

  /* índice del último día del dataset que no supera la fecha dada */
  function indiceHasta(ds, f) {
    let k = -1;
    ds.dias.forEach((t, i) => { const g = parseFecha(t); if (g && valorFecha(g) <= valorFecha(f)) k = i; });
    return k;
  }

  function semanal(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const med = medidaDe(opt.medida || P.medida);
    const mk = opt.marca && opt.marca !== "TODAS" ? opt.marca : "TODAS";
    const mi = mk === "TODAS" ? -1 : ds.marcas.indexOf(mk);
    const tgt = mk === "TODAS" ? 100 : P.marca(mk).target;
    const T = tiempos(ds, opt.hasta || P.corte, P.fer);
    const H = T.habiles;
    const iHasta = indiceHasta(ds, T.c);
    const sem = semanasDelMes(ds.anio, ds.mesNum, P.fer), total = sem.length;
    const semanaDeDia = dm => { let k = 0; sem.forEach((s, i) => { if (dm >= s.desde) k = i; }); return k; };
    const diaDelMes = ds.dias.map(f => parseInt(String(f).split("/")[0], 10));
    const semActual = semanaDeDia(T.c.d);
    const habEnCurso = Math.max(0, T.diasTrans - sem[semActual].habAntes);

    const fueraS = new Set((opt.excluir || []).map(n => ds.marcas.indexOf(n)).filter(i => i >= 0));
    const porVend = {};
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA || x[4] > iHasta || fueraS.has(x[3])) return;
      const v = x[2];
      if (!porVend[v]) porVend[v] = { vol: sem.map(() => 0), cli: sem.map(() => new Set()) };
      const k = semanaDeDia(diaDelMes[x[4]]);
      porVend[v].vol[k] += x[med.i];
      if ((x[8] || 0) === TIPO_DOC.FACTURA && x[6] > 0 && (mi < 0 || x[3] === mi)) porVend[v].cli[k].add(x[0]);
    });

    const nombres = new Set(Object.keys(porVend).map(Number));
    ds.vends.forEach((n, i) => { const pv = P.vend(n, i); if (pv[med.cuota] || pv.cartera) nombres.add(i); });

    const filas = Array.from(nombres).map(i => {
      const nom = ds.vends[i], pv = P.vend(nom, i);
      const base = pv.cartera != null ? pv.cartera : 0;
      const metaCli = Math.round(base * tgt / 100), cuota = pv[med.cuota];
      if (!base && !cuota) return null;
      const D = porVend[i] || { vol: sem.map(() => 0), cli: sem.map(() => new Set()) };
      const vistos = new Set();
      let volAcum = 0;
      const semanas = sem.map((S, k) => {
        D.cli[k].forEach(c => vistos.add(c));
        volAcum += D.vol[k];
        const estado = k < semActual ? "cerrada" : k === semActual ? "en curso" : "por venir";
        const habSem = estado === "en curso" ? habEnCurso : S.dias;          /* días exigibles de la semana */
        const habAcum = S.habAntes + (estado === "por venir" ? S.dias : habSem);
        const metaVolSem = cuota * S.dias / H, metaCliSem = metaCli * S.dias / H;
        const metaVolAcum = cuota * habAcum / H, metaCliAcum = metaCli * habAcum / H;
        const activa = estado !== "por venir";
        return {
          semana: S.n, desde: S.desde, hasta: S.hasta, dias: S.dias, feriados: S.feriados,
          peso: 100 * S.dias / H, estado, transcurrida: activa, habExigibles: habSem,
          vol: D.vol[k], volAcum: activa ? volAcum : null,
          metaVolSem, metaVolExigible: cuota * habSem / H, metaVolAcum,
          deficitVol: activa && cuota ? Math.max(0, metaVolAcum - volAcum) : 0,
          clientesSem: D.cli[k].size, clientesAcum: activa ? vistos.size : null,
          metaCliSem, metaCliAcum,
          deficitCli: activa && metaCli ? Math.max(0, Math.round(metaCliAcum - vistos.size)) : 0
        };
      });
      const ult = semanas[semActual], finSem = sem[semActual];
      const metaFinSemVol = cuota * (finSem.habAntes + finSem.dias) / H;
      const metaFinSemCli = metaCli * (finSem.habAntes + finSem.dias) / H;
      const diasRestSem = Math.max(0, finSem.dias - habEnCurso);
      return {
        vendedor: nom, supervisor: pv.sup, cartera: base, metaCli, cuota, semanas,
        volAcum: ult.volAcum, clientesAcum: ult.clientesAcum, metaVolAcum: ult.metaVolAcum, metaCliAcum: ult.metaCliAcum,
        deficitVol: ult.deficitVol, deficitCli: ult.deficitCli,
        incumpleVol: ult.deficitVol > 0, incumpleCli: ult.deficitCli > 0,
        cumplVol: ult.metaVolAcum ? 100 * ult.volAcum / ult.metaVolAcum : null,
        cumplCli: ult.metaCliAcum ? 100 * ult.clientesAcum / ult.metaCliAcum : null,
        /* lo que falta para llegar sano al viernes de la semana en curso */
        faltaSemVol: Math.max(0, metaFinSemVol - ult.volAcum), faltaSemCli: Math.max(0, Math.round(metaFinSemCli - ult.clientesAcum)),
        diasRestSem
      };
    }).filter(Boolean).sort((a, b) => (b.deficitCli - a.deficitCli) || (b.deficitVol - a.deficitVol));

    /* totales: el volumen solo de asesores con cuota y la cobertura solo de asesores con cartera,
       para que el cumplimiento compare lo mismo contra lo mismo. El déficit del equipo es la suma de
       los déficits individuales: el sobrecumplimiento de uno no tapa el atraso de otro. */
    const tot = filas.reduce((a, v) => ({
      cuota: a.cuota + v.cuota, volAcum: a.volAcum + (v.cuota ? v.volAcum : 0), metaVolAcum: a.metaVolAcum + v.metaVolAcum,
      deficitVol: a.deficitVol + v.deficitVol, metaCli: a.metaCli + v.metaCli, clientesAcum: a.clientesAcum + (v.metaCli ? v.clientesAcum : 0),
      metaCliAcum: a.metaCliAcum + v.metaCliAcum, deficitCli: a.deficitCli + v.deficitCli
    }), { cuota: 0, volAcum: 0, metaVolAcum: 0, deficitVol: 0, metaCli: 0, clientesAcum: 0, metaCliAcum: 0, deficitCli: 0 });
    tot.cumplVol = tot.metaVolAcum ? 100 * tot.volAcum / tot.metaVolAcum : null;
    tot.cumplCli = tot.metaCliAcum ? 100 * tot.clientesAcum / tot.metaCliAcum : null;

    return {
      medida: med, marca: mk, target: tgt, semanas: sem, total, semActual, corte: T.corte,
      habiles: H, diasTrans: T.diasTrans, habEnCurso, feriados: P.feriados,
      filas, totales: tot, sinCuota: filas.every(f => !f.cuota),
      enDeficit: filas.filter(f => f.incumpleVol || f.incumpleCli)
    };
  }

  /* ---------- CIERRE DIARIO (registro histórico congelado) ----------
     Un cierre es la foto del déficit semanal al terminar un día, calculada solo con lo
     facturado hasta ese día. Una vez registrado no se recalcula, salvo que se pida rehacer. */
  const r2 = n => Math.round((n || 0) * 100) / 100;
  function cierre(ds, cfg, fecha) {
    const P = params(ds, cfg);
    const U = semanal(ds, cfg, { hasta: fecha, medida: "usd", marca: "TODAS" });
    const K = semanal(ds, cfg, { hasta: fecha, medida: "kg", marca: "TODAS" });
    const kg = {}; K.filas.forEach(f => kg[f.vendedor] = f);
    const f = parseFecha(fecha), iH = indiceHasta(ds, f);

    const vm = {}, ve = {};
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA || x[4] > iH) return;
      const M = vm[x[3]] = vm[x[3]] || { us: 0, kg: 0, cli: new Set(), usDia: 0 };
      M.us += x[6]; M.kg += x[5];
      if (x[4] === iH) M.usDia += x[6];
      if ((x[8] || 0) === TIPO_DOC.FACTURA && x[6] > 0) M.cli.add(x[0]);
      if (x[4] === iH) ve[x[2]] = (ve[x[2]] || 0) + x[6];
    });
    const avance = U.diasTrans / U.habiles;
    const marcas = P.ranking.map(n => {
      const i = ds.marcas.indexOf(n), M = vm[i] || { us: 0, kg: 0, cli: new Set(), usDia: 0 }, pm = P.marca(n);
      return { m: n, foco: P.foco.indexOf(n) > -1 ? 1 : 0, us: r2(M.us), usDia: r2(M.usDia), kg: r2(M.kg), act: M.cli.size,
               cuUs: pm.cuotaUsd, cuKg: pm.cuotaKg, metaUs: r2(pm.cuotaUsd * avance), metaKg: r2(pm.cuotaKg * avance), tgt: pm.target };
    }).filter(m => m.us || m.cuUs || m.cuKg);

    const vendedores = U.filas.map(u => {
      const k = kg[u.vendedor] || {}, iv = ds.vends.indexOf(u.vendedor);
      const sa = u.semanas[U.semActual], sk = k.semanas ? k.semanas[U.semActual] : {};
      return {
        v: u.vendedor, sup: u.supervisor, cartera: u.cartera, metaCli: u.metaCli,
        cli: u.clientesAcum, metaCliAcum: r2(u.metaCliAcum), defCli: u.deficitCli, faltaSemCli: u.faltaSemCli,
        usDia: r2(ve[iv] || 0),
        us: { cuota: u.cuota, acum: r2(u.volAcum), meta: r2(u.metaVolAcum), def: r2(u.deficitVol), sem: r2(sa.vol), metaSem: r2(sa.metaVolSem), falta: r2(u.faltaSemVol) },
        kg: { cuota: k.cuota || 0, acum: r2(k.volAcum), meta: r2(k.metaVolAcum), def: r2(k.deficitVol), sem: r2(sk.vol), metaSem: r2(sk.metaVolSem), falta: r2(k.faltaSemVol) }
      };
    });
    const S = U.semanas[U.semActual];
    return {
      fecha: fechaTxt(f), iso: isoDe(fechaTxt(f)), mes: ds.mes, archivo: ds.archivo, registrado: Date.now(),
      diaHabil: U.diasTrans, habiles: U.habiles, semana: S.n, semanas: U.total,
      semanaDesde: S.desde, semanaHasta: S.hasta, diasSemana: S.dias, habEnCurso: U.habEnCurso,
      habil: esHabil(f.y, f.m, f.d, P.fer) ? 1 : 0, universo: P.universo,
      calendario: U.semanas.map(s => ({ n: s.n, desde: s.desde, hasta: s.hasta, dias: s.dias, feriados: s.feriados })),
      totales: {
        us: { cuota: U.totales.cuota, acum: r2(U.totales.volAcum), meta: r2(U.totales.metaVolAcum), def: r2(U.totales.deficitVol) },
        kg: { cuota: K.totales.cuota, acum: r2(K.totales.volAcum), meta: r2(K.totales.metaVolAcum), def: r2(K.totales.deficitVol) },
        cli: { meta: r2(U.totales.metaCliAcum), acum: U.totales.clientesAcum, def: U.totales.deficitCli },
        enDeficit: U.enDeficit.length, asesores: U.filas.length
      },
      vendedores, marcas
    };
  }

  /* días del archivo que ya terminaron: todos menos el último, y el último si es anterior a hoy */
  function diasCerrados(ds, incluirUltimo) {
    const hoy = new Date(), vHoy = hoy.getFullYear() * 1e4 + (hoy.getMonth() + 1) * 100 + hoy.getDate();
    return ds.dias.filter((t, i) => {
      const f = parseFecha(t); if (!f) return false;
      if (i < ds.dias.length - 1) return true;
      return incluirUltimo || valorFecha(f) < vHoy;
    });
  }
  const historialVacio = () => ({ version: "historial-1", cierres: {} });
  function fusionarHistorial(a, b) {
    const h = historialVacio();
    [a, b].forEach(x => Object.entries((x && x.cierres) || {}).forEach(([k, c]) => {
      if (!h.cierres[k] || (c.registrado || 0) > (h.cierres[k].registrado || 0)) h.cierres[k] = c;
    }));
    return h;
  }
  /* registra los cierres que faltan; con rehacer=true reemplaza los del mes del archivo */
  function registrarCierres(ds, cfg, hist, op) {
    op = op || {};
    const h = fusionarHistorial(hist, null), nuevos = [];
    diasCerrados(ds, op.incluirUltimo).forEach(t => {
      const k = isoDe(t);
      if (h.cierres[k] && !op.rehacer) return;
      h.cierres[k] = cierre(ds, cfg, t); nuevos.push(t);
    });
    h.actualizado = Date.now();
    return { historial: h, nuevos };
  }
  async function cargarHistorial() {
    let remoto = null, error = null;
    try {
      const res = await fetch("historial.json?v=" + Date.now(), { cache: "no-store" });
      if (res.ok) { const j = await res.json(); if (j && j.cierres) remoto = j; else error = "historial.json sin formato"; }
      else error = "historial.json respondió " + res.status;
    } catch (e) { error = e.message; }
    const local = leerLocal("historial");
    return { h: fusionarHistorial(remoto, local), remoto: !!remoto, local: !!local, error };
  }


  /* ---------- RESUMEN PERSONALIZADO POR ASESOR (modelo "Seguimiento por Asesor") ----------
     Targets por subcategoría para la marca con detalle por categoría (tabla de cumplimiento Nestlé).
     Chocolates y galletas se miden sobre la cartera Confites; el resto sobre la cartera A&B. */
  const TARGETS_SUB = { "CALDOS": 75, "SOPAS": 75, "LECHE CONDENSADA": 20, "CHOCOLATES": 85, "GALLETAS": 70,
    "CERELAC": 40, "NESTEA": 25, "NESTUM": 30, "LA CAMPESINA": 20, "NUTRIRINDE": 20 };
  const SUB_CONFITES = ["CHOCOLATES", "GALLETAS"];
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  function reporteAsesores(ds, cfg, opt) {
    opt = opt || {};
    const P = params(ds, cfg);
    const mR = medidaDe(opt.medidaRoll || "kg"), mM = medidaDe(opt.medidaMarcas || "usd");
    const metaAct = hay(opt.metaAct) ? num(opt.metaAct) : 85;
    const T = tiempos(ds, opt.hasta || P.corte, P.fer);
    const iH = indiceHasta(ds, T.c);
    const det = opt.marcaDetalle && ds.marcas.indexOf(opt.marcaDetalle) > -1 ? ds.marcas.indexOf(opt.marcaDetalle) : -1;
    const marcasSel = (opt.marcas || []).map(n => ds.marcas.indexOf(n)).filter(i => i >= 0 && i !== det && !(opt.excluir || []).includes(ds.marcas[i]));
    const subTgt = Object.assign({}, TARGETS_SUB, (cfg && cfg.subTargets) || {});
    const supSel = opt.supervisores && opt.supervisores.length ? new Set(opt.supervisores) : null;
    const fuera = new Set((opt.excluir || []).map(n => ds.marcas.indexOf(n)).filter(i => i >= 0));
    const aseSel = opt.asesores && opt.asesores.length ? new Set(opt.asesores) : null;

    const V = {};
    const acc = () => ({ act: new Set(), us: 0, kg: 0 });
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA || x[4] > iH || fuera.has(x[3])) return;
      const v = x[2], activa = (x[8] || 0) === TIPO_DOC.FACTURA && x[6] > 0;
      const A = V[v] = V[v] || { tot: acc(), marcas: {}, subs: {} };
      A.tot.us += x[6]; A.tot.kg += x[5]; if (activa) A.tot.act.add(x[0]);
      const M = A.marcas[x[3]] = A.marcas[x[3]] || acc();
      M.us += x[6]; M.kg += x[5]; if (activa) M.act.add(x[0]);
      if (x[3] === det) {
        const S = A.subs[x[9]] = A.subs[x[9]] || acc();
        S.us += x[6]; S.kg += x[5]; if (activa) S.act.add(x[0]);
      }
    });
    const volDe = (A, m) => A ? (m.i === 6 ? A.us : A.kg) : 0;
    const universo = P.universo || 1;

    /* subcategorías de la marca con detalle: las que tienen target; si ninguna, todas con el target por defecto */
    const esNestleDet = det > -1 && /NESTL/.test(ds.marcas[det]);
    const subsDet = det < 0 ? [] : Array.from(new Set(ds.r.filter(x => x[3] === det).map(x => ds.subs[x[9]])));
    let subsEval = subsDet.filter(sb => subTgt[sb] != null && subTgt[sb] > 0);
    const conTargetPropio = subsEval.length > 0;
    if (!conTargetPropio) subsEval = subsDet;
    Object.keys(TARGETS_SUB).forEach(sb => { if (conTargetPropio && esNestleDet && subsEval.indexOf(sb) < 0) subsEval.push(sb); });

    const asesores = ds.vends.map((nom, i) => {
      const pv = P.vend(nom, i), base = CARTERAS[pv.clave] || {};
      const A = V[i];
      const cartera = pv.cartera != null ? pv.cartera : (A ? A.tot.act.size : 0);
      if (!cartera && !A) return null;
      if (supSel && !supSel.has(pv.sup)) return null;
      if (aseSel && !aseSel.has(nom)) return null;
      const act = A ? A.tot.act.size : 0;
      const real = volDe(A && A.tot, mR), cuota = pv[mR.cuota];
      const faltan = cuota ? Math.max(0, cuota - real) : null;
      const metaCli = Math.ceil(cartera * metaAct / 100);
      const categorias = subsEval.map(sb => {
        const k = ds.subs.indexOf(sb), S = A && k > -1 ? A.subs[k] : null;
        const esConf = SUB_CONFITES.indexOf(sb) > -1;
        const b = esNestleDet ? ((esConf ? base.conf : base.ab) || cartera) : cartera;
        const tgt = conTargetPropio ? subTgt[sb] : P.targetDef;
        const a = S ? S.act.size : 0, pct = b ? 100 * a / b : 0;
        return { cat: sb, activados: a, base: b, pct, target: tgt, cumpl: tgt ? 100 * pct / tgt : null, vol: volDe(S, mR) };
      }).sort((x, y) => (x.cumpl || 0) - (y.cumpl || 0) || x.cat.localeCompare(y.cat));
      const detalle = det < 0 ? null : (() => {
        const M = A ? A.marcas[det] : null;
        return { marca: ds.marcas[det], activados: M ? M.act.size : 0, vol: volDe(M, mR) };
      })();
      const marcas = marcasSel.map(mi => {
        const n = ds.marcas[mi], M = A ? A.marcas[mi] : null, pm = P.marca(n);
        const a = M ? M.act.size : 0, cuotaM = pm[mM.cuota] ? pm[mM.cuota] * cartera / universo : 0;
        const venta = volDe(M, mM);
        return { marca: n, cartera, activos: a, pct: cartera ? 100 * a / cartera : 0, target: pm.target,
                 cuota: cuotaM, venta, pctVol: cuotaM ? 100 * venta / cuotaM : null };
      });
      return {
        vendedor: nom, supervisor: pv.sup, enEstructura: pv.enEstructura,
        cartera, activados: act, pctAct: cartera ? 100 * act / cartera : null,
        real, cuota, pctRoll: cuota ? 100 * real / cuota : null, faltan,
        porDia: faltan != null ? faltan / T.restantes : null,
        metaCli, faltanCli: Math.max(0, metaCli - act),
        detalle, categorias, marcas
      };
    }).filter(Boolean);

    const grupos = new Map();
    asesores.forEach(a => { if (!grupos.has(a.supervisor)) grupos.set(a.supervisor, []); grupos.get(a.supervisor).push(a); });
    const supervisiones = Array.from(grupos.entries()).map(([sup, eq]) => {
      const t = eq.reduce((o, a) => ({ cartera: o.cartera + a.cartera, act: o.act + a.activados, real: o.real + (a.cuota ? a.real : 0), cuota: o.cuota + (a.cuota || 0) }), { cartera: 0, act: 0, real: 0, cuota: 0 });
      return { supervisor: sup, asesores: eq, totales: Object.assign(t, { pctAct: t.cartera ? 100 * t.act / t.cartera : null, pctRoll: t.cuota ? 100 * t.real / t.cuota : null, faltan: t.cuota ? Math.max(0, t.cuota - t.real) : null }) };
    }).sort((a, b) => a.supervisor.localeCompare(b.supervisor));

    const ultHabil = habilesHasta(ds.anio, ds.mesNum, new Date(ds.anio, ds.mesNum, 0).getDate(), P.fer);
    return {
      medidaRoll: mR, medidaMarcas: mM, metaAct, marcaDetalle: det < 0 ? null : ds.marcas[det], subsConTarget: conTargetPropio,
      meta: { corte: T.corte, mes: ds.mes, mesNombre: MESES[ds.mesNum - 1] + " " + ds.anio, diasTrans: T.diasTrans, habiles: T.habiles,
              restantes: Math.max(0, T.habiles - T.diasTrans), tt: 100 * T.diasTrans / T.habiles, parcial: T.diasTrans < ultHabil, archivo: ds.archivo },
      supervisiones, supervisoresTodos: Array.from(new Set(ds.vends.map((n, i) => P.vend(n, i).sup))).sort()
    };
  }

  /* ---------- RESUMEN NARRATIVO ---------- */
  function narrativa(M) {
    const g = M.glob, m = M.meta, md = M.medida;
    const p = [];
    p.push(`Entre el ${m.desde} y el ${m.hasta} se procesaron ${f0(m.registros)} líneas de facturación de ${f0(g.marcasActivas)} marcas. Se registraron ${f0(g.activados)} clientes con venta efectiva sobre un ${m.origenUniverso} de ${f0(g.universo)}, es decir ${fp(g.pctAct)} de cobertura del portafolio, y ${f0(g.noActivados)} clientes sin compra en el período. El corte cubre ${m.diasTrans} de ${m.habiles} días hábiles del mes ${m.mes}, por lo que las proyecciones aplican un factor de ${m.factor.toFixed(2)} sobre el ritmo actual.`);

    p.push(`La venta del período suma ${fu(g.venta)} y ${f1(g.kilos)} kg. Las ${f0(g.n80)} primeras marcas concentran el 80% de la venta y las cinco mayores el ${fp(g.top5)}. Cada cliente activo compra en promedio ${f1(g.profundidad)} marcas, con una venta media de ${fu(g.ventaCliente)} por cliente.`);

    if (g.cuotaTotal) p.push(`Contra la cuota total del portafolio de ${md.fmt(g.cuotaTotal)}, el avance es de ${fp(g.cumplTotal)} y la proyección de cierre llega a ${md.fmt(g.volProy)} (${fp(g.cumplTotalProy)}), ${g.faltanteTotalProy > 0 ? md.fmt(g.faltanteTotalProy) + " por debajo del objetivo" : "superándolo en " + md.fmt(Math.abs(g.faltanteTotalProy))}.`);
    else p.push(`Aún no hay cuotas de volumen cargadas por marca; al definirlas en el panel administrativo este resumen incorporará el avance y la proyección contra objetivo.`);

    const ord = M.foco.slice().sort((a, b) => (b.cumpl || 0) - (a.cumpl || 0));
    if (ord.length) {
      const mejor = ord[0], peor = ord[ord.length - 1];
      const faltan = M.foco.reduce((a, c) => a + c.faltan, 0), cerradas = M.foco.filter(c => c.cumpl >= 100).length;

  function csv(filas, cab){
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';

  }
  function bajar(nombre, texto){

    a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));

    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);

      ${R.sinCuotaMarca ? `<div class="vacio" style="margin-bottom:12px">No hay cuotas por marca en ${md.nombre}. Cárguelas en el panel administrativo para ver cumplimiento y necesidad diaria.</div>` : ""}

  /* ---------- semanal ---------- */
  let DIA_SEM = "";      /* día de cierre elegido en la pestaña semanal ("" = corte vigente) */
  function calendario(W, cuotaEq, md){

        ${cuotaEq ? `<div style="font-size:.72rem;opacity:.9">meta ${md.fmt(cuotaEq*s.dias/tot)}</div>` : ""}
        <div style="font-size:.68rem;font-weight:800;margin-top:2px">${est}${est === "en curso" ? " · " + W.habEnCurso + " de " + s.dias + " días" : ""}</div></div>`;

  function tablaSemanal(){
    const W = VJ.semanal(DS, CFG, Object.assign(opt(), { hasta: DIA_SEM || undefined })), md = W.medida;
    const cuotaEq = W.totales.cuota;
    const cab = W.semanas.map((s,k) => `<th>S${s.n}<br><small style="font-weight:600">${s.desde}–${s.hasta} · ${s.dias}d · ${fp(100*s.dias/W.habiles)}</small></th>`).join("");
    const celda = (sm, real, meta, metaSem, deficit, fmt, activa) => {
      if (!activa) return `<td class="sem fuera">—</td>`;
      if (sm.estado === "por venir") return `<td class="sem fuera"><small>meta acum.</small>${fmt(meta)}</td>`;
      return `<td class="sem"><span class="pill ${deficit > 0 ? "mal" : "ok"}">${deficit > 0 ? "−" + fmt(deficit) : "al día"}</span><small>${fmt(real)} de ${fmt(meta)}${sm.estado === "en curso" ? " · en curso" : ""}</small></td>`;
    };
    const bloque = (titulo, sub, kReal, kMeta, kMetaSem, kDef, kInc, kFalta, fmt, total, activa) => `
      <div class="tarjeta c12"><h3>${titulo}</h3><p class="sub">${sub}</p>
        <div class="tw"><table>
          <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Meta del mes</th>${cab}<th>Déficit al ${W.corte.slice(0,5)}</th><th>Para cerrar la semana ${W.semActual+1}</th></tr></thead>
          <tbody>${W.filas.filter(activa).map(v => `<tr><td><b>${v.vendedor}</b></td><td>${v.supervisor}</td>
            <td>${fmt(kReal === "volAcum" ? v.cuota : v.metaCli)}</td>
            ${v.semanas.map(sm => celda(sm, sm[kReal], sm[kMeta], sm[kMetaSem], sm[kDef], fmt, true)).join("")}
            <td><span class="pill ${v[kInc] ? "mal" : "ok"}">${v[kInc] ? fmt(v[kDef]) : "al día"}</span></td>
            <td>${v[kFalta] > 0 ? `${fmt(v[kFalta])}<small style="display:block;color:var(--gris);font-size:.68rem">${v.diasRestSem ? "en " + v.diasRestSem + " día" + (v.diasRestSem===1?"":"s") + " · " + fmt(v[kFalta]/v.diasRestSem) + "/día" : "último día de la semana"}</small>` : "cubierta"}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td>—</td><td>${fmt(kReal === "volAcum" ? W.totales.cuota : W.totales.metaCli)}</td>${W.semanas.map(() => "<td>—</td>").join("")}<td>${fmt(total)}</td><td>—</td></tr></tfoot>
        </table></div></div>`;

    const enDef = W.enDeficit;
    const dias = DS.dias.slice().reverse();
    const selector = `<div class="buscador no-print" style="margin:0 0 10px">
        <label for="fDiaSem" style="font-size:.78rem;font-weight:700;color:var(--gris)">Ver el déficit al cierre del día</label>
        <select id="fDiaSem"><option value="">Corte vigente (${W.corte})</option>${dias.map(d => `<option value="${d}" ${d === DIA_SEM ? "selected" : ""}>${d}</option>`).join("")}</select>
        <span style="font-size:.76rem;color:var(--gris)">Solo cuenta lo facturado hasta ese día. Los cierres ya registrados están en la pestaña Histórico.</span></div>`;

    const logica = `<div class="tarjeta c12">
      <h3>Calendario de metas de ${DS.mes}</h3>
      <p class="sub">${W.habiles} días hábiles${W.feriados.length ? " (sin feriados: " + W.feriados.filter(f => f.slice(3) === DS.mes).join(", ") + ")" : ""} en ${W.total} semanas de lunes a viernes. Cada semana recibe la parte de la cuota que corresponde a sus días hábiles: el ancho de cada bloque es su peso. Día ${W.diasTrans} de ${W.habiles} al ${W.corte}.</p>
      ${selector}
      ${calendario(W, cuotaEq, md)}
      <p class="notas" style="margin-top:10px">Meta acumulada al cierre de un día = meta del mes × días hábiles transcurridos ÷ ${W.habiles}. En la semana en curso solo se exige lo que corresponde a los días ya vividos. Déficit = meta acumulada − real acumulado; el del equipo es la suma de los déficits individuales.</p>
    </div>`;

    const aviso = `<div class="tarjeta aviso c12">
      <h3>Aviso de incumplimiento al ${W.corte}</h3>
      <p class="sub">Semana ${W.semActual + 1} de ${W.total} · día hábil ${W.diasTrans} de ${W.habiles}</p>
      ${enDef.length === 0 ? `<p class="notas">Ningún asesor arrastra déficit acumulado a esta fecha.</p>`
        : `<p style="font-size:.86rem;margin:0 0 8px"><b>${enDef.length}</b> de ${W.filas.length} asesores están por debajo de la meta acumulada.</p>
           <div>${enDef.map(v => `<span class="chip ${v.incumpleVol && v.incumpleCli ? "mal" : "med"}">${v.vendedor}: ${v.incumpleVol ? md.fmt(v.deficitVol) : ""}${v.incumpleVol && v.incumpleCli ? " · " : ""}${v.incumpleCli ? f0(v.deficitCli) + " clientes" : ""}</span>`).join("")}</div>`}
      <p class="notas" style="margin-top:12px">Déficit total acumulado: ${W.sinCuota ? "" : `<b>${md.fmt(W.totales.deficitVol)}</b> (cumplimiento ${fp(W.totales.cumplVol)}) y `}<b>${f0(W.totales.deficitCli)} clientes</b> (cobertura ${fp(W.totales.cumplCli)}) en ${W.marca === "TODAS" ? "activación general" : W.marca}.</p>
    </div>`;

    return logica + aviso +
      (W.sinCuota ? avisoCuota(`El déficit de volumen necesita cuotas por asesor en ${md.nombre}. Cárguelas en la estructura comercial del panel administrativo.`)
        : bloque(`Déficit semanal en ${md.nombre}`, `Cada celda: déficit acumulado al cierre de la semana (o al día de corte si está en curso) y, debajo, real contra meta acumulada. Las semanas por venir muestran la meta acumulada que habrá que alcanzar.`, "volAcum", "metaVolAcum", "metaVolSem", "deficitVol", "incumpleVol", "faltaSemVol", md.fmt, W.totales.deficitVol, v => v.cuota > 0)) +
      bloque(`Déficit semanal en cobertura · ${nomMarca(W.marca)}`, `Meta de clientes activados = cartera × target ${W.target}%, repartida por días hábiles igual que la cuota.`, "clientesAcum", "metaCliAcum", "metaCliSem", "deficitCli", "incumpleCli", "faltaSemCli", f0, W.totales.deficitCli, v => v.cartera > 0);
  }
  function pintarSemanal(){
